<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Flappy Verity</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#0a0a1a}
canvas{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}

.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:rgba(10,10,26,.8);backdrop-filter:blur(12px);opacity:1;transition:opacity .4s}
.overlay.hidden{opacity:0;pointer-events:none}

.menu{background:linear-gradient(145deg,rgba(255,217,61,.1),rgba(255,100,50,.05));border:1px solid rgba(255,217,61,.2);border-radius:32px;padding:44px 52px;text-align:center;color:#fff;max-width:400px;width:90%;animation:popIn .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 24px 80px rgba(255,100,50,.15),inset 0 1px 0 rgba(255,255,255,.08)}
@keyframes popIn{from{transform:scale(.7) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

.menu h1{font-family:'Fredoka One',cursive;font-size:2.6rem;background:linear-gradient(135deg,#FFD93D,#FF8C00,#FF5722);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 6px rgba(255,100,50,.4));margin-bottom:2px}
.menu .subtitle{color:rgba(255,255,255,.45);font-size:.88rem;margin-bottom:28px;letter-spacing:.5px}

.menu-btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;font-family:'Inter',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:.25s;margin-bottom:10px;letter-spacing:.3px}
.menu-btn:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.btn-play{background:linear-gradient(135deg,#FF6B35,#FF4444);color:#fff;box-shadow:0 4px 20px rgba(255,70,50,.35)}
.btn-play:hover{box-shadow:0 8px 35px rgba(255,70,50,.5)}
.btn-lang{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.1)}
.btn-lang:hover{background:rgba(255,255,255,.12);color:#fff}

.score-row{display:flex;justify-content:center;gap:32px;margin:20px 0 24px}
.score-box{text-align:center}
.score-box .label{font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.35);margin-bottom:4px}
.score-box .val{font-family:'Fredoka One',cursive;font-size:1.8rem;color:#FFD93D;text-shadow:0 2px 10px rgba(255,217,61,.3)}

.lang-toggle{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
.lang-btn{padding:8px 22px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.4);font-weight:700;cursor:pointer;transition:.2s;font-size:.82rem}
.lang-btn.active{background:linear-gradient(135deg,#FFD93D,#FF8C00);color:#1a1a2e;border-color:transparent;box-shadow:0 2px 12px rgba(255,217,61,.3)}

.game-over-title{font-family:'Fredoka One',cursive;font-size:2.2rem;background:linear-gradient(135deg,#FF5252,#FF1744);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 8px rgba(255,23,68,.4));margin-bottom:4px}
.medal{font-size:3.5rem;margin:8px 0;filter:drop-shadow(0 4px 12px rgba(255,215,0,.3))}

.pause-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:90;background:rgba(10,10,26,.6);backdrop-filter:blur(6px)}
.pause-overlay.hidden{display:none}
.pause-text{font-family:'Fredoka One',cursive;font-size:2.4rem;background:linear-gradient(135deg,#fff,#aaa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="overlay" id="mainMenu">
  <div class="menu">
    <h1 id="menuTitle">Flappy Verity</h1>
    <p class="subtitle" id="menuSubtitle">How far can Verity fly?</p>
    <div class="lang-toggle">
      <button class="lang-btn active" id="langEn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="langRu" onclick="setLang('ru')">RU</button>
    </div>
    <div class="score-row">
      <div class="score-box"><div class="label" id="lblScore">Score</div><div class="val" id="menuScore">0</div></div>
      <div class="score-box"><div class="label" id="lblBest">Best</div><div class="val" id="menuBest">0</div></div>
    </div>
    <button class="menu-btn btn-play" id="btnPlay" onclick="startGame()">PLAY</button>
  </div>
</div>

<div class="overlay hidden" id="gameOverMenu">
  <div class="menu">
    <div class="game-over-title" id="goTitle">GAME OVER</div>
    <div class="medal" id="goMedal"></div>
    <div class="score-row">
      <div class="score-box"><div class="label" id="lblScoreGo">Score</div><div class="val" id="goScore">0</div></div>
      <div class="score-box"><div class="label" id="lblBestGo">Best</div><div class="val" id="goBest">0</div></div>
    </div>
    <button class="menu-btn btn-play" id="btnRestart" onclick="startGame()">RETRY</button>
    <button class="menu-btn btn-lang" id="btnHome" onclick="showMenu()">HOME</button>
  </div>
</div>

<div class="pause-overlay hidden" id="pauseOverlay">
  <div class="pause-text" id="pauseText">PAUSED</div>
</div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
let W,H,groundY;
let state='menu',score=0,best=0,lang='en';
let verity,pipes,frame,speed,gravity,flapPower,pipeGap,pipeW,pipeInterval;
let shakeX=0,shakeY=0,shakeDur=0;
let particles=[],bgStars=[],cloudLayers=[];

const T={
  en:{play:'PLAY',retry:'RETRY',home:'HOME',gameOver:'GAME OVER',score:'Score',best:'Best',title:'Flappy Verity',subtitle:'How far can Verity fly?',paused:'PAUSED',tap:'TAP TO FLY'},
  ru:{play:'ИГРАТЬ',retry:'ЗАНОВО',home:'ДОМОЙ',gameOver:'ИГРА ОКОНЧЕНА',score:'Счёт',best:'Рекорд',title:'Flappy Verity',subtitle:'Как далеко долетит Verity?',paused:'ПАУЗА',tap:'НАЖМИ ЧТОБЫ ЛЕТЕТЬ'}
};

function resize(){
  const dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  C.width=W*dpr;C.height=H*dpr;
  C.style.width=W+'px';C.style.height=H+'px';
  X.setTransform(dpr,0,0,dpr,0,0);
  groundY=H-80;
}
window.addEventListener('resize',resize);resize();

function initBgStars(){
  bgStars=[];cloudLayers=[];
  for(let i=0;i<60;i++)bgStars.push({x:Math.random()*W,y:Math.random()*groundY,r:Math.random()*1.5+.3,a:Math.random(),s:Math.random()*.02+.005});
  for(let l=0;l<3;l++){cloudLayers[l]=[];for(let i=0;i<4+l*2;i++)cloudLayers[l].push({x:Math.random()*W*1.5-W*.25,y:20+l*35+Math.random()*40,w:50+Math.random()*80,h:18+Math.random()*16,a:.06+l*.03});}
}
initBgStars();

function loadSave(){
  try{const s=localStorage.getItem('fv_data');if(s){const d=JSON.parse(s);best=d.best||0;lang=d.lang||'en'}}catch(e){}
  const m=document.cookie.match(/fv_best=(\d+)/);if(m)best=Math.max(best,parseInt(m[1]));
  updateLangUI();
}
function save(){try{localStorage.setItem('fv_data',JSON.stringify({best,lang}))}catch(e){}document.cookie=`fv_best=${best};path=/;max-age=31536000`;}
function setLang(l){lang=l;save();updateLangUI();}
function updateLangUI(){
  const t=T[lang];
  document.getElementById('langEn').classList.toggle('active',lang==='en');
  document.getElementById('langRu').classList.toggle('active',lang==='ru');
  document.getElementById('menuTitle').textContent=t.title;
  document.getElementById('menuSubtitle').textContent=t.subtitle;
  document.getElementById('btnPlay').textContent=t.play;
  document.getElementById('btnRestart').textContent=t.retry;
  document.getElementById('btnHome').textContent=t.home;
  document.getElementById('goTitle').textContent=t.gameOver;
  document.getElementById('pauseText').textContent=t.paused;
  document.getElementById('lblScore').textContent=t.score;
  document.getElementById('lblBest').textContent=t.best;
  document.getElementById('lblScoreGo').textContent=t.score;
  document.getElementById('lblBestGo').textContent=t.best;
  updateScores();
}
function updateScores(){
  document.getElementById('menuScore').textContent=score;
  document.getElementById('menuBest').textContent=best;
  document.getElementById('goScore').textContent=score;
  document.getElementById('goBest').textContent=best;
}

function showMenu(){state='menu';document.getElementById('mainMenu').classList.remove('hidden');document.getElementById('gameOverMenu').classList.add('hidden');document.getElementById('pauseOverlay').classList.add('hidden');updateScores();}
function showGameOver(){
  state='dead';updateScores();
  document.getElementById('gameOverMenu').classList.remove('hidden');
  const m=document.getElementById('goMedal');
  if(score>=40)m.textContent='🏆';else if(score>=20)m.textContent='🥇';else if(score>=10)m.textContent='🥈';else if(score>=5)m.textContent='🥉';else m.textContent='';
}

function initGame(){
  speed=2.2;gravity=0.48;flapPower=-7.8;pipeGap=155;pipeW=62;pipeInterval=95;
  verity={x:W*.3,y:H*.4,vy:0,rot:0,wingT:0,bobT:0,trail:[]};
  pipes=[];score=0;frame=0;particles=[];
}
function startGame(){initGame();state='playing';document.getElementById('mainMenu').classList.add('hidden');document.getElementById('gameOverMenu').classList.add('hidden');document.getElementById('pauseOverlay').classList.add('hidden');}

function flap(){if(state==='playing'){verity.vy=flapPower;verity.wingT=10;for(let i=0;i<4;i++)spawnParticle(verity.x-10,verity.y+8,(Math.random()-.5)*2,-Math.random()*2-1,'#FFD93D');}}
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();flap();}if(e.code==='Escape'&&state==='playing'){state='paused';document.getElementById('pauseOverlay').classList.remove('hidden')}else if(e.code==='Escape'&&state==='paused'){state='playing';document.getElementById('pauseOverlay').classList.add('hidden')}});
C.addEventListener('pointerdown',e=>{e.preventDefault();flap();});

function addPipe(){const minY=80,maxY=groundY-pipeGap-80;const topH=minY+Math.random()*(maxY-minY);pipes.push({x:W+10,topH,scored:false});}

function spawnParticle(x,y,vx,vy,color){particles.push({x,y,vx,vy,life:30+Math.random()*20,maxLife:50,size:Math.random()*4+2,color});}
function spawnDeathParticles(){
  for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2;const sp=Math.random()*4+2;spawnParticle(verity.x,verity.y,Math.cos(a)*sp,Math.sin(a)*sp,Math.random()>.5?'#FFD93D':'#FF6B35');}
}

function update(){
  if(state!=='playing')return;
  frame++;
  if(frame%pipeInterval===0)addPipe();
  verity.vy+=gravity;verity.y+=verity.vy;
  verity.rot=Math.min(Math.max(verity.vy*3.5,-35),90);
  if(verity.wingT>0)verity.wingT--;
  verity.bobT+=0.1;
  verity.trail.push({x:verity.x,y:verity.y,life:12});
  if(verity.trail.length>15)verity.trail.shift();
  verity.trail.forEach(t=>t.life--);
  verity.trail=verity.trail.filter(t=>t.life>0);
  if(Math.random()<.15)spawnParticle(verity.x-12+Math.random()*6,verity.y+5,(Math.random()-.5)*.5,Math.random()*.5+0.2,'#FF8C00');
  if(verity.y<0){verity.y=0;verity.vy=0;}
  if(verity.y+20>=groundY){die();return;}
  for(let i=pipes.length-1;i>=0;i--){
    pipes[i].x-=speed;
    if(pipes[i].x+pipeW<0){pipes.splice(i,1);continue;}
    if(!pipes[i].scored&&pipes[i].x+pipeW<verity.x){pipes[i].scored=true;score++;}
    const p=pipes[i];
    const r={x:verity.x-14,y:verity.y-14,w:28,h:28};
    const tR={x:p.x,y:0,w:pipeW,h:p.topH};
    const bR={x:p.x,y:p.topH+pipeGap,w:pipeW,h:groundY-p.topH-pipeGap};
    if(rectOverlap(r,tR)||rectOverlap(r,bR)){die();return;}
  }
  particles.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.life--;s.vx*=.96;s.vy*=.96;});
  particles=particles.filter(s=>s.life>0);
}
function rectOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function die(){state='dead';frame=0;shakeDur=15;spawnDeathParticles();if(score>best){best=score;save();}showGameOver();}

/* ── DRAWING ── */

function drawBg(){
  const g=X.createLinearGradient(0,0,0,groundY);
  g.addColorStop(0,'#0B0D2E');g.addColorStop(.4,'#1A1040');g.addColorStop(.75,'#2D1B69');g.addColorStop(1,'#4A2080');
  X.fillStyle=g;X.fillRect(0,0,W,groundY);
  bgStars.forEach(s=>{s.a=.3+Math.sin(frame*s.s)*.3;X.fillStyle=`rgba(255,255,255,${s.a})`;X.beginPath();X.arc(s.x,s.y,s.r,0,Math.PI*2);X.fill();});
  cloudLayers.forEach((layer,l)=>{layer.forEach(c=>{c.x-=.15*(l+1);if(c.x+c.w<-50)c.x=W+50;X.fillStyle=`rgba(180,140,255,${c.a})`;drawCloudShape(c.x,c.y,c.w,c.h);});});
}
function drawCloudShape(x,y,w,h){
  X.beginPath();X.ellipse(x,y,w*.5,h*.5,0,0,Math.PI*2);X.fill();
  X.beginPath();X.ellipse(x+w*.3,y-h*.15,w*.35,h*.4,0,0,Math.PI*2);X.fill();
  X.beginPath();X.ellipse(x+w*.6,y+h*.05,w*.3,h*.35,0,0,Math.PI*2);X.fill();
}

function drawMountains(){
  X.fillStyle='#1a0f30';
  X.beginPath();X.moveTo(0,groundY);
  for(let x=0;x<=W;x+=80){X.lineTo(x,groundY-30-Math.sin(x*.005)*40-Math.cos(x*.008)*25);}
  X.lineTo(W,groundY);X.fill();
  X.fillStyle='#231545';
  X.beginPath();X.moveTo(0,groundY);
  for(let x=0;x<=W;x+=60){X.lineTo(x,groundY-15-Math.sin(x*.007+1)*25-Math.cos(x*.004)*15);}
  X.lineTo(W,groundY);X.fill();
}

function drawPipe(p){
  const topH=p.topH,botY=p.topH+pipeGap;
  const capH=28,capOver=8;
  drawPipeBody(p.x,0,pipeW,topH,true);
  drawPipeCap(p.x-capOver,topH-capH,pipeW+capOver*2,capH);
  drawPipeBody(p.x,botY,pipeW,groundY-botY,false);
  drawPipeCap(p.x-capOver,botY,pipeW+capOver*2,capH);
}
function drawPipeBody(x,y,w,h,isTop){
  const g=X.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,'#1B8C3A');g.addColorStop(.15,'#27AE4A');g.addColorStop(.5,'#2ECC55');g.addColorStop(.85,'#27AE4A');g.addColorStop(1,'#1A7A32');
  X.fillStyle=g;X.fillRect(x,y,w,h);
  X.fillStyle='rgba(255,255,255,.12)';X.fillRect(x+4,y,8,h);
  X.fillStyle='rgba(0,0,0,.15)';X.fillRect(x+w-10,y,10,h);
  const shine=X.createLinearGradient(x,0,x,Math.min(h,40));
  shine.addColorStop(0,'rgba(255,255,255,.08)');shine.addColorStop(1,'transparent');
  X.fillStyle=shine;X.fillRect(x,y,w,Math.min(h,40));
}
function drawPipeCap(x,y,w,h){
  const g=X.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,'#167A30');g.addColorStop(.1,'#20993E');g.addColorStop(.5,'#25A844');g.addColorStop(.9,'#20993E');g.addColorStop(1,'#147028');
  X.fillStyle=g;
  roundRect(x,y,w,h,6);X.fill();
  X.fillStyle='rgba(255,255,255,.1)';roundRect(x+3,y+2,w-6,h*.35,4);X.fill();
  X.strokeStyle='rgba(0,0,0,.2)';X.lineWidth=1.5;roundRect(x,y,w,h,6);X.stroke();
}

function drawGround(){
  const gy=groundY;
  const g=X.createLinearGradient(0,gy,0,H);
  g.addColorStop(0,'#5D8A1B');g.addColorStop(.3,'#4E7516');g.addColorStop(1,'#3D5E10');
  X.fillStyle=g;X.fillRect(0,gy,W,H-gy);
  const dirt=X.createLinearGradient(0,gy+12,0,H);
  dirt.addColorStop(0,'#6B4E2A');dirt.addColorStop(1,'#4A3518');
  X.fillStyle=dirt;X.fillRect(0,gy+12,W,H-gy-12);
  X.fillStyle='#6FA520';
  const offset=(frame*speed)%30;
  for(let x=-30;x<W+30;x+=30){
    const bx=x-offset;
    X.beginPath();X.moveTo(bx,gy);X.lineTo(bx+8,gy-10-Math.sin(bx*.1)*3);X.lineTo(bx+15,gy);X.fill();
    X.beginPath();X.moveTo(bx+15,gy);X.lineTo(bx+22,gy-7-Math.cos(bx*.12)*2);X.lineTo(bx+30,gy);X.fill();
  }
  X.fillStyle='rgba(111,165,32,.4)';
  for(let x=-30;x<W+30;x+=45){
    const bx=x-offset*.5;
    X.beginPath();X.moveTo(bx,gy);X.lineTo(bx+6,gy-14);X.lineTo(bx+12,gy);X.fill();
  }
}

function drawVerity(){
  const {x,y,rot}=verity;
  X.save();X.translate(x,y);X.rotate(rot*Math.PI/180);
  const r=20;

  // Glow
  const glow=X.createRadialGradient(0,0,r*.3,0,0,r*2.5);
  glow.addColorStop(0,'rgba(255,217,61,.25)');glow.addColorStop(1,'transparent');
  X.fillStyle=glow;X.beginPath();X.arc(0,0,r*2.5,0,Math.PI*2);X.fill();

  // Shadow
  X.fillStyle='rgba(0,0,0,.2)';X.beginPath();X.ellipse(3,4,r,r*.7,0,0,Math.PI*2);X.fill();

  // Body
  const bg=X.createRadialGradient(-5,-5,2,0,0,r);
  bg.addColorStop(0,'#FFF176');bg.addColorStop(.4,'#FFD93D');bg.addColorStop(1,'#F9A825');
  X.fillStyle=bg;X.beginPath();X.arc(0,0,r,0,Math.PI*2);X.fill();
  X.strokeStyle='rgba(200,160,0,.5)';X.lineWidth=1.5;X.stroke();

  // Highlight
  const hl=X.createRadialGradient(-6,-7,1,-6,-7,r*.6);
  hl.addColorStop(0,'rgba(255,255,255,.5)');hl.addColorStop(1,'transparent');
  X.fillStyle=hl;X.beginPath();X.arc(-6,-7,r*.6,0,Math.PI*2);X.fill();

  // Eyes
  X.fillStyle='#2C2C2C';
  X.beginPath();X.ellipse(-6,-4,4,4.5,0,0,Math.PI*2);X.fill();
  X.beginPath();X.ellipse(7,-4,4,4.5,0,0,Math.PI*2);X.fill();
  X.fillStyle='#fff';
  X.beginPath();X.arc(-5,-6,2,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(8,-6,2,0,Math.PI*2);X.fill();
  X.fillStyle='#fff';
  X.beginPath();X.arc(-7,-2,1,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(6,-2,1,0,Math.PI*2);X.fill();

  // Mouth
  X.strokeStyle='#5D4037';X.lineWidth=2.2;X.lineCap='round';
  X.beginPath();X.arc(1,3,7,.1*Math.PI,.9*Math.PI);X.stroke();
  X.fillStyle='rgba(255,100,100,.15)';X.beginPath();X.arc(1,3,6,.15*Math.PI,.85*Math.PI);X.fill();

  // Blush
  X.fillStyle='rgba(255,120,120,.3)';
  X.beginPath();X.ellipse(-13,4,5,3.5,-.1,0,Math.PI*2);X.fill();
  X.beginPath();X.ellipse(14,4,5,35,.1,0,Math.PI*2);X.fill();

  // Wing
  X.save();X.translate(-r+2,3);
  const wAngle=verity.wingT>0?-0.6+Math.sin(verity.wingT*1)*0.5:0.2+Math.sin(verity.bobT)*0.25;
  X.rotate(wAngle);
  const wg=X.createLinearGradient(-12,0,8,0);
  wg.addColorStop(0,'#FFC107');wg.addColorStop(1,'#FFB300');
  X.fillStyle=wg;
  X.beginPath();X.ellipse(0,0,14,7,-.3,0,Math.PI*2);X.fill();
  X.strokeStyle='rgba(200,160,0,.4)';X.lineWidth=1;X.stroke();
  X.restore();

  X.restore();

  // Trail
  verity.trail.forEach(t=>{
    const a=t.life/12*.3;
    X.fillStyle=`rgba(255,217,61,${a})`;
    X.beginPath();X.arc(t.x,t.y,4*(t.life/12),0,Math.PI*2);X.fill();
  });
}

function drawParticles(){
  particles.forEach(p=>{
    const a=p.life/p.maxLife;
    X.globalAlpha=a;
    X.fillStyle=p.color;
    X.beginPath();X.arc(p.x,p.y,p.size*a,0,Math.PI*2);X.fill();
  });
  X.globalAlpha=1;
}

function drawScore(){
  X.save();
  X.font='bold 52px "Fredoka One",cursive';X.textAlign='center';X.textBaseline='top';
  // Shadow layers
  X.fillStyle='rgba(0,0,0,.35)';X.fillText(score,W/2+2,44);
  X.fillStyle='rgba(0,0,0,.15)';X.fillText(score,W/2+1,42);
  // Main
  const sg=X.createLinearGradient(W/2-30,40,W/2+30,90);
  sg.addColorStop(0,'#FFFFFF');sg.addColorStop(.5,'#FFE082');sg.addColorStop(1,'#FFB300');
  X.fillStyle=sg;X.fillText(score,W/2,40);
  // Outline
  X.strokeStyle='rgba(200,140,0,.5)';X.lineWidth=2;X.strokeText(score,W/2,40);
  // Glow
  X.shadowColor='rgba(255,200,0,.3)';X.shadowBlur=20;X.fillText(score,W/2,40);
  X.restore();
}

function drawTapHint(){
  if(frame<70&&state==='playing'){
    const a=(1-Math.abs(Math.sin(frame*.06)))*.8;
    X.save();X.globalAlpha=a;
    X.font='bold 18px Inter,sans-serif';X.textAlign='center';
    X.fillStyle='rgba(255,255,255,.7)';X.fillText(T[lang].tap,W/2,H*.22);
    X.restore();
  }
}

function roundRect(x,y,w,h,r){
  X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath();
}

function render(){
  X.save();
  if(shakeDur>0){shakeX=(Math.random()-.5)*shakeDur*.8;shakeY=(Math.random()-.5)*shakeDur*.8;X.translate(shakeX,shakeY);shakeDur--;}
  drawBg();drawMountains();pipes.forEach(drawPipe);drawGround();drawParticles();drawVerity();drawScore();drawTapHint();
  X.restore();
}

function loop(){update();render();requestAnimationFrame(loop);}

loadSave();initGame();loop();
</script>
