<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Flappy Verity</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--y:#FFD93D;--g1:#4CAF50;--g2:#388E3C;--sky1:#70C5CE;--sky2:#87CEEB;--gr1:#DED895;--gr2:#BFCA52}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#000}
canvas{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}

.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);opacity:1;transition:opacity .3s}
.overlay.hidden{opacity:0;pointer-events:none}

.menu{background:linear-gradient(145deg,rgba(255,217,61,.15),rgba(255,255,255,.05));border:2px solid rgba(255,217,61,.3);border-radius:28px;padding:40px 48px;text-align:center;color:#fff;max-width:380px;width:90%;animation:popIn .4s ease}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

.menu h1{font-family:'Fredoka One',cursive;font-size:2.4rem;color:var(--y);text-shadow:0 3px 0 #c9a800,0 6px 20px rgba(255,217,61,.3);margin-bottom:4px}
.menu .verity-face{font-size:4rem;margin:12px 0;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-8px) rotate(5deg)}}
.menu .subtitle{color:rgba(255,255,255,.5);font-size:.9rem;margin-bottom:24px}

.menu-btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-family:'Inter',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:.2s;margin-bottom:10px}
.menu-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.btn-play{background:linear-gradient(135deg,#4CAF50,#388E3C);color:#fff}
.btn-lang{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn-lang:hover{background:rgba(255,255,255,.2)}

.score-display{font-family:'Fredoka One',cursive;font-size:1.4rem;color:var(--y);margin:16px 0 8px}
.best-display{color:rgba(255,255,255,.5);font-size:.85rem;margin-bottom:20px}

.lang-toggle{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.lang-btn{padding:8px 20px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.5);font-weight:700;cursor:pointer;transition:.2s;font-size:.85rem}
.lang-btn.active{background:var(--y);color:#000;border-color:var(--y)}

.game-over-title{font-family:'Fredoka One',cursive;font-size:2rem;color:#FF5252;text-shadow:0 3px 0 #c62828;margin-bottom:8px}
.medal{font-size:3rem;margin:8px 0}

.pause-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:90;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.pause-overlay.hidden{display:none}
.pause-text{font-family:'Fredoka One',cursive;font-size:2rem;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- Main Menu -->
<div class="overlay" id="mainMenu">
  <div class="menu">
    <h1 id="menuTitle">Flappy Verity</h1>
    <div class="verity-face">😊</div>
    <p class="subtitle" id="menuSubtitle">How far can Verity fly?</p>
    <div class="lang-toggle">
      <button class="lang-btn active" id="langEn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="langRu" onclick="setLang('ru')">RU</button>
    </div>
    <div class="score-display" id="menuScore"></div>
    <div class="best-display" id="menuBest"></div>
    <button class="menu-btn btn-play" id="btnPlay" onclick="startGame()">PLAY</button>
  </div>
</div>

<!-- Game Over -->
<div class="overlay hidden" id="gameOverMenu">
  <div class="menu">
    <div class="game-over-title" id="goTitle">GAME OVER</div>
    <div class="medal" id="goMedal"></div>
    <div class="score-display" id="goScore"></div>
    <div class="best-display" id="goBest"></div>
    <button class="menu-btn btn-play" id="btnRestart" onclick="startGame()">RETRY</button>
    <button class="menu-btn btn-lang" id="btnHome" onclick="showMenu()">HOME</button>
  </div>
</div>

<!-- Pause -->
<div class="pause-overlay hidden" id="pauseOverlay">
  <div class="pause-text" id="pauseText">PAUSED</div>
</div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
let W,H,groundY;
let state='menu'; // menu, playing, paused, dead
let score=0, best=0;
let lang='en';
let verity, pipes, frame, speed, gravity, flapPower, pipeGap, pipeW, pipeInterval;
let shakeX=0, shakeY=0, shakeDur=0;
let starParticles=[];

const T={
  en:{play:'PLAY',retry:'RETRY',home:'HOME',gameOver:'GAME OVER',score:'Score',best:'Best',title:'Flappy Verity',subtitle:'How far can Verity fly?',paused:'PAUSED',tapToFly:'TAP TO FLY'},
  ru:{play:'ИГРАТЬ',retry:'ЗАНОВО',home:'ДОМОЙ',gameOver:'ИГРА ОКОНЧЕНА',score:'Счёт',best:'Рекорд',title:'Flappy Verity',subtitle:'Как далеко долетит Verity?',paused:'ПАУЗА',tapToFly:'НАЖМИ ЧТОБЫ ЛЕТЕТЬ'}
};

function resize(){
  const dpr=window.devicePixelRatio||1;
  W=window.innerWidth; H=window.innerHeight;
  C.width=W*dpr; C.height=H*dpr;
  C.style.width=W+'px'; C.style.height=H+'px';
  X.setTransform(dpr,0,0,dpr,0,0);
  groundY=H-80;
}
window.addEventListener('resize',resize);
resize();

function loadSave(){
  try{
    const s=localStorage.getItem('fv_data');
    if(s){const d=JSON.parse(s);best=d.best||0;lang=d.lang||'en'}
  }catch(e){}
  const m=document.cookie.match(/fv_best=(\d+)/);
  if(m)best=Math.max(best,parseInt(m[1]));
  updateLangUI();
}
function save(){
  try{localStorage.setItem('fv_data',JSON.stringify({best,lang}))}catch(e){}
  document.cookie=`fv_best=${best};path=/;max-age=31536000`;
}

function setLang(l){
  lang=l; save(); updateLangUI();
}
function updateLangUI(){
  const t=T[lang];
  document.getElementById('langEn').classList.toggle('active',lang==='en');
  document.getElementById('langRu').classList.toggle('active',lang==='ru');
  document.getElementById('menuTitle').textContent=t.title;
  document.getElementById('menuSubtitle').textContent=t.subtitle;
  document.getElementById('btnPlay').textContent=t.play;
  document.getElementById('btnRestart').textContent=t.retry;
  document.getElementById('btnHome').textContent=t.home;
  document.getElementById('goTitle').textContent=t.gameOver;
  document.getElementById('pauseText').textContent=t.paused;
}

function showMenu(){
  state='menu';
  document.getElementById('mainMenu').classList.remove('hidden');
  document.getElementById('gameOverMenu').classList.add('hidden');
  document.getElementById('pauseOverlay').classList.add('hidden');
  updateMenuScores();
}
function updateMenuScores(){
  const t=T[lang];
  document.getElementById('menuScore').textContent=score?`${t.score}: ${score}`:'';
  document.getElementById('menuBest').textContent=best?`${t.best}: ${best}`:'';
}
function showGameOver(){
  state='dead';
  document.getElementById('gameOverMenu').classList.remove('hidden');
  const t=T[lang];
  document.getElementById('goScore').textContent=`${t.score}: ${score}`;
  document.getElementById('goBest').textContent=`${t.best}: ${best}`;
  const m=document.getElementById('goMedal');
  if(score>=40)m.textContent='🏆';else if(score>=20)m.textContent='🥇';else if(score>=10)m.textContent='🥈';else if(score>=5)m.textContent='🥉';else m.textContent='';
}

function initGame(){
  speed=2; gravity=0.45; flapPower=-7.5; pipeGap=150; pipeW=60; pipeInterval=100;
  verity={x:W*0.3, y:H*0.4, vy:0, rot:0, wingT:0, bobT:0};
  pipes=[]; score=0; frame=0; starParticles=[];
}

function startGame(){
  initGame();
  state='playing';
  document.getElementById('mainMenu').classList.add('hidden');
  document.getElementById('gameOverMenu').classList.add('hidden');
  document.getElementById('pauseOverlay').classList.add('hidden');
}

function flap(){
  if(state==='playing'){verity.vy=flapPower;verity.wingT=8;}
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();flap();}
  if(e.code==='Escape'&&state==='playing'){state='paused';document.getElementById('pauseOverlay').classList.remove('hidden');}
  else if(e.code==='Escape'&&state==='paused'){state='playing';document.getElementById('pauseOverlay').classList.add('hidden');}
});
C.addEventListener('pointerdown',e=>{e.preventDefault();flap();});

function addPipe(){
  const minY=100, maxY=groundY-pipeGap-100;
  const topH=minY+Math.random()*(maxY-minY);
  pipes.push({x:W+10, topH, scored:false});
}

function spawnStars(){
  for(let i=0;i<6;i++){
    starParticles.push({
      x:verity.x+Math.random()*20-10,
      y:verity.y+Math.random()*20-10,
      vx:(Math.random()-0.5)*3,
      vy:(Math.random()-0.5)*3,
      life:20+Math.random()*20,
      maxLife:40,
      size:Math.random()*3+1
    });
  }
}

function update(){
  if(state!=='playing')return;
  frame++;
  if(frame%pipeInterval===0)addPipe();

  verity.vy+=gravity;
  verity.y+=verity.vy;
  verity.rot=Math.min(Math.max(verity.vy*3,-30),90);
  if(verity.wingT>0)verity.wingT--;
  verity.bobT+=0.08;

  if(verity.y<0){verity.y=0;verity.vy=0;}
  if(verity.y+20>=groundY){die();return;}

  for(let i=pipes.length-1;i>=0;i--){
    pipes[i].x-=speed;
    if(pipes[i].x+pipeW<0){pipes.splice(i,1);continue;}
    if(!pipes[i].scored&&pipes[i].x+pipeW<verity.x){
      pipes[i].scored=true;score++;
    }
    const p=pipes[i];
    const r={x:verity.x-14,y:verity.y-14,w:28,h:28};
    const tR={x:p.x,y:0,w:pipeW,h:p.topH};
    const bR={x:p.x,y:p.topH+pipeGap,w:pipeW,h:groundY-p.topH-pipeGap};
    if(rectOverlap(r,tR)||rectOverlap(r,bR)){die();return;}
  }

  starParticles.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.life--;});
  starParticles=starParticles.filter(s=>s.life>0);
}

function rectOverlap(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function die(){
  state='dead'; frame=0;
  shakeDur=12;
  spawnStars();
  if(score>best){best=score;save();}
  showGameOver();
}

function drawSky(){
  const g=X.createLinearGradient(0,0,0,groundY);
  g.addColorStop(0,'#4EC5F1');g.addColorStop(1,'#70C5CE');
  X.fillStyle=g;X.fillRect(0,0,W,groundY);
  X.fillStyle='rgba(255,255,255,0.3)';
  for(let i=0;i<5;i++){
    const cx=(i*W/4+frame*0.3*(i%2===0?1:-1))%(W+200)-100;
    drawCloud(cx,60+i*30,40+i*8);
  }
}
function drawCloud(x,y,s){
  X.beginPath();X.arc(x,y,s,0,Math.PI*2);X.arc(x+s*.7,y-s*.2,s*.7,0,Math.PI*2);X.arc(x+s*1.2,y,s*.8,0,Math.PI*2);X.fill();
}

function drawGround(){
  const g=X.createLinearGradient(0,groundY,0,H);
  g.addColorStop(0,'#DED895');g.addColorStop(1,'#BFCA52');
  X.fillStyle=g;X.fillRect(0,groundY,W,H-groundY);
  X.fillStyle='#5D8A1B';
  for(let i=0;i<W+40;i+=40){
    X.beginPath();
    X.moveTo(i,groundY);X.lineTo(i+20,groundY+12);X.lineTo(i+40,groundY);
    X.fill();
  }
}

function drawPipe(p){
  const topH=p.topH, botY=p.topH+pipeGap;
  const g1='#4CAF50',g2='#388E3C',h='#2E7D32',capH=26,capOver=6;
  X.fillStyle=g1;X.fillRect(p.x,0,pipeW,topH);
  X.fillStyle=g2;X.fillRect(p.x+4,0,8,topH);
  X.fillStyle=h;X.fillRect(p.x-3,topH-capH,pipeW+6,capH);
  X.fillStyle='#1B5E20';X.fillRect(p.x-3,topH-capH,pipeW+6,4);
  X.fillStyle=g1;X.fillRect(p.x,botY,pipeW,groundY-botY);
  X.fillStyle=g2;X.fillRect(p.x+4,botY,8,groundY-botY);
  X.fillStyle=h;X.fillRect(p.x-3,botY,pipeW+6,capH);
  X.fillStyle='#1B5E20';X.fillRect(p.x-3,botY,pipeW+6,4);
}

function drawVerity(){
  const {x,y,rot}=verity;
  X.save();X.translate(x,y);X.rotate(rot*Math.PI/180);
  const r=18;
  // Body
  const bg=X.createRadialGradient(-4,-4,2,0,0,r);
  bg.addColorStop(0,'#FFE55C');bg.addColorStop(1,'#FFD93D');
  X.fillStyle=bg;X.beginPath();X.arc(0,0,r,0,Math.PI*2);X.fill();
  X.strokeStyle='#C9A800';X.lineWidth=2;X.stroke();
  // Eyes
  X.fillStyle='#333';
  X.beginPath();X.arc(-6,-4,3.5,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(6,-4,3.5,0,Math.PI*2);X.fill();
  X.fillStyle='#fff';
  X.beginPath();X.arc(-5,-5.5,1.5,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(7,-5.5,1.5,0,Math.PI*2);X.fill();
  // Mouth
  X.strokeStyle='#333';X.lineWidth=2;X.lineCap='round';
  X.beginPath();X.arc(0,2,7,0.15*Math.PI,0.85*Math.PI);X.stroke();
  // Wing
  X.fillStyle='#FFCC02';
  X.save();X.translate(-r+2,2);
  const wingAngle=verity.wingT>0?-0.5+Math.sin(verity.wingT*0.8)*0.4:0.15+Math.sin(verity.bobT)*0.2;
  X.rotate(wingAngle);
  X.beginPath();X.ellipse(0,0,12,6,-0.3,0,Math.PI*2);X.fill();
  X.restore();
  // Blush
  X.fillStyle='rgba(255,130,130,0.35)';
  X.beginPath();X.ellipse(-11,3,5,3,0,0,Math.PI*2);X.fill();
  X.beginPath();X.ellipse(11,3,5,3,0,0,Math.PI*2);X.fill();
  X.restore();
}

function drawStars(){
  starParticles.forEach(s=>{
    const a=s.life/s.maxLife;
    X.fillStyle=`rgba(255,217,61,${a})`;
    X.beginPath();X.arc(s.x,s.y,s.size*a,0,Math.PI*2);X.fill();
  });
}

function drawScore(){
  X.save();
  X.font='bold 48px "Fredoka One",cursive';
  X.textAlign='center';X.textBaseline='top';
  X.fillStyle='rgba(0,0,0,0.25)';X.fillText(score,W/2+2,42);
  X.fillStyle='#fff';X.fillText(score,W/2,40);
  X.strokeStyle='#C9A800';X.lineWidth=3;X.strokeText(score,W/2,40);
  X.restore();
}

function drawTapHint(){
  if(frame<60&&state==='playing'){
    const a=1-frame/60;
    X.save();X.globalAlpha=a;
    X.font='bold 18px Inter,sans-serif';X.textAlign='center';
    X.fillStyle='#fff';X.fillText(T[lang].tapToFly,W/2,H*0.25);
    X.restore();
  }
}

function render(){
  X.save();
  if(shakeDur>0){
    shakeX=(Math.random()-0.5)*shakeDur;
    shakeY=(Math.random()-0.5)*shakeDur;
    X.translate(shakeX,shakeY);
    shakeDur--;
  }

  drawSky();
  pipes.forEach(drawPipe);
  drawGround();
  drawStars();
  drawVerity();
  drawScore();
  drawTapHint();

  X.restore();
}

function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}

loadSave();
initGame();
loop();
</script>
</body>
</html>
