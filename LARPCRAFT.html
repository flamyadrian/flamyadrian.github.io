      m.head.rotation.y = clamp(a,-1.2,1.2);
      m.head.rotation.x = clamp(Math.atan2(dy+player.h*0.4-this.h*0.8, Math.max(0.5,Math.hypot(dx,dz))),-0.6,0.6);
    } else if (m.head){ m.head.rotation.y*=0.9; m.head.rotation.x*=0.9; }
  }
  explode(){
    const R=3.0;
    Sfx.explode();
    const cx=Math.floor(this.x), cy=Math.floor(this.y+0.5), cz=Math.floor(this.z);
    for(let y=-R;y<=R;y++) for(let z=-R;z<=R;z++) for(let x=-R;x<=R;x++){
      if (Math.hypot(x,y,z)>R-Math.random()*0.8) continue;
      const bx=cx+x, by=cy+y, bz=cz+z;
      const id=this.world.getBlock(bx,by,bz);
      if (id>0 && id!==6 && BLOCKS[id].hardness>=0 && BLOCKS[id].hardness<20){
        this.world.setBlock(bx,by,bz,0);
        if (Math.random()<0.28){
          const dr=BLOCKS[id].drop;
          if (dr>0) this.world.entities.push(new ItemEntity(this.world,bx+0.5,by+0.5,bz+0.5,stackOf(dr,1)));
        }
      }
    }
    const d=Math.hypot(player.x-this.x,player.y-this.y,player.z-this.z);
    if (d<7){ player.damage(Math.round(24*(1-d/7)));
      const l=d||1; player.vx+=(player.x-this.x)/l*9; player.vz+=(player.z-this.z)/l*9; player.vy+=6; }
    for(const e of this.world.entities){
      if (e===this || !(e instanceof MobEntity)) continue;
      const dd=Math.hypot(e.x-this.x,e.y-this.y,e.z-this.z);
      if (dd<6) e.damage(Math.round(20*(1-dd/6)), this);
    }
    spawnExplosionFx(this.x,this.y+0.5,this.z);
    this.remove();
  }
}
function findGround(world,x,z){
  const xi=Math.floor(x), zi=Math.floor(z);
  for(let y=CH-2;y>1;y--){
    if (isSolid(world.getBlockSafe(xi,y,zi)) && !world.getBlockSafe(xi,y+1,zi) && !world.getBlockSafe(xi,y+2,zi)) return y+1;
  }
  return -1;
}

const Particles = {
  N: 900, pts:null, pos:null, col:null, vel:null, life:null, size:null, head:0,
  init(){
    this.pos=new Float32Array(this.N*3); this.col=new Float32Array(this.N*3);
    this.vel=new Float32Array(this.N*3); this.life=new Float32Array(this.N);
    this.size=new Float32Array(this.N);
    for(let i=0;i<this.N;i++){ this.pos[i*3+1]=-9999; this.size[i]=0.001; }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(this.pos,3));
    g.setAttribute('color',new THREE.BufferAttribute(this.col,3));
    g.setAttribute('psize',new THREE.BufferAttribute(this.size,1));
    const m=new THREE.PointsMaterial({size:0.13,sizeAttenuation:true,vertexColors:true,
      transparent:true, depthWrite:false, fog:true});
    this.pts=new THREE.Points(g,m); this.pts.frustumCulled=false;
    scene.add(this.pts);
  },
  spawn(x,y,z,vx,vy,vz,r,g,b,life){
    const i=this.head; this.head=(this.head+1)%this.N;
    this.pos[i*3]=x; this.pos[i*3+1]=y; this.pos[i*3+2]=z;
    this.vel[i*3]=vx; this.vel[i*3+1]=vy; this.vel[i*3+2]=vz;
    this.col[i*3]=r; this.col[i*3+1]=g; this.col[i*3+2]=b;
    this.life[i]=life;
  },
  update(dt){
    if(!this.pts) return;
    for(let i=0;i<this.N;i++){
      if (this.life[i]<=0){ if(this.pos[i*3+1]>-9000){ this.pos[i*3+1]=-9999; } continue; }
      this.life[i]-=dt;
      this.vel[i*3+1]-=18*dt;
      this.pos[i*3]+=this.vel[i*3]*dt;
      this.pos[i*3+1]+=this.vel[i*3+1]*dt;
      this.pos[i*3+2]+=this.vel[i*3+2]*dt;
      this.vel[i*3]*=Math.pow(0.25,dt); this.vel[i*3+2]*=Math.pow(0.25,dt);
      if (this.life[i]<=0) this.pos[i*3+1]=-9999;
    }
    this.pts.geometry.attributes.position.needsUpdate=true;
    this.pts.geometry.attributes.color.needsUpdate=true;
  },
  clear(){ for(let i=0;i<this.N;i++){ this.life[i]=0; this.pos[i*3+1]=-9999; } }
};
function blockAvgColor(id){
  const b=BLOCKS[id]; if(!b) return [1,1,1];
  const t=b.tx[2];
  const cx=(t%ACOLS)*CELL+8, cy=((t/ACOLS)|0)*CELL+8;
  const ctx=atlasCanvas.getContext('2d');
  const d=ctx.getImageData(cx+4,cy+4,6,6).data;
  let r=0,g=0,bl=0;
  for(let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; bl+=d[i+2]; }
  const n=d.length/4;
  return [Math.pow(r/n/255,2.2), Math.pow(g/n/255,2.2), Math.pow(bl/n/255,2.2)];
}
const _colCache={};
function blockColor(id){ if(!_colCache[id]) _colCache[id]=blockAvgColor(id); return _colCache[id]; }
function spawnBlockParticles(x,y,z,id,n){
  const c=blockColor(id);
  for(let i=0;i<n;i++){
    Particles.spawn(x+0.2+Math.random()*0.6, y+0.2+Math.random()*0.6, z+0.2+Math.random()*0.6,
      (Math.random()-0.5)*3.2, Math.random()*3.6, (Math.random()-0.5)*3.2,
      c[0]*(0.75+Math.random()*0.5), c[1]*(0.75+Math.random()*0.5), c[2]*(0.75+Math.random()*0.5),
      0.6+Math.random()*0.6);
  }
}
function spawnExplosionFx(x,y,z){
  for(let i=0;i<90;i++){
    const a=Math.random()*6.283, b=Math.random()*Math.PI, s=3+Math.random()*11;
    Particles.spawn(x,y,z, Math.sin(b)*Math.cos(a)*s, Math.cos(b)*s*0.9+2, Math.sin(b)*Math.sin(a)*s,
      1.0, 0.55+Math.random()*0.35, 0.15, 0.7+Math.random()*0.7);
  }
}

/* ------------------------------------------------------------------ *
 * 17. PLAYER                                                           *
 * ------------------------------------------------------------------ */
const INV_SIZE=36;
class Player extends Body {
  constructor(world,x,y,z){
    super(x,y,z,0.6,1.8);
    this.world=world; this.yaw=0; this.pitch=0;
    this.inv=new Inventory(INV_SIZE); this.sel=0;
    this.health=20; this.food=20; this.sat=5; this.air=300;
    this.mode='survival'; this.flying=false; this.sprint=false; this.sneak=false;
    this.dead=false; this.breaking=null; this.breakT=0; this.swing=0;
    this.attackCd=0; this.useCd=0; this.hurtT=0; this.fallStart=null;
    this.spawn=[x,y,z]; this.bobT=0; this.stepDist=0; this.regenT=0; this.starveT=0;
    this.score=0;
  }
  held(){ return this.inv.get(this.sel); }
  damage(n, from){
    if (this.mode==='creative'||this.dead||this.hurtT>0.35) return;
    this.health-=n; this.hurtT=0.5; Sfx.hurt();
    flashDamage();
    if (from){ const dx=this.x-from.x, dz=this.z-from.z, l=Math.hypot(dx,dz)||1;
      this.vx+=dx/l*5.5; this.vz+=dz/l*5.5; this.vy=Math.max(this.vy,4.4); }
    if (this.health<=0){ this.health=0; this.die(); }
  }
  heal(n){ this.health=Math.min(20,this.health+n); }
  die(){
    this.dead=true;
    for(let i=0;i<INV_SIZE;i++){
      const s=this.inv.get(i);
      if (s){ this.world.entities.push(new ItemEntity(this.world,this.x,this.y+1,this.z,s)); this.inv.set(i,null); }
    }
    showDeath();
  }
  respawn(){
    this.dead=false; this.health=20; this.food=20; this.sat=5; this.air=300;
    this.vx=this.vy=this.vz=0;
    let [sx,sy,sz]=this.spawn;
    const g=findGround(this.world,sx,sz);
    if (g>0) sy=g;
    this.x=sx; this.y=sy; this.z=sz;
  }
  update(dt, input){
    if (this.dead) return;
    this.hurtT=Math.max(0,this.hurtT-dt);
    this.attackCd-=dt; this.useCd-=dt;
    if (this.swing>0) this.swing=Math.max(0,this.swing-dt*4.2);
    this.updateFluid(this.world);
    this.sneak = input.sneak && this.onGround && !this.flying;
    const creative = this.mode==='creative';
    if (!creative) this.flying=false;

    // ---- movement input ----
    let fx=0, fz=0;
    if (input.fwd) fz+=1; if (input.back) fz-=1;
    if (input.left) fx-=1; if (input.right) fx+=1;
    const ml=Math.hypot(fx,fz);
    if (ml>0){ fx/=ml; fz/=ml; }
    // camera looks along (-sin yaw, 0, -cos yaw); right is (cos yaw, 0, -sin yaw)
    const sy=Math.sin(this.yaw), cy=Math.cos(this.yaw);
    const wx = -fz*sy + fx*cy;
    const wz = -fz*cy - fx*sy;
    this.sprint = input.sprint && ml>0 && !this.sneak && (this.food>6||creative);

    let speed = 4.317;
    if (this.sneak) speed=1.31;
    else if (this.sprint) speed=5.612;
    if (this.flying) speed = this.sprint?21.0:10.9;
    if (this.inWater && !this.flying) speed*=0.55;
    if (!this.onGround && !this.flying && !this.inWater) speed*=1.0;

    const acc = (this.onGround||this.flying)?34:8.5;
    this.vx += wx*speed*acc*dt;
    this.vz += wz*speed*acc*dt;
    let fric;
    if (this.flying) fric=Math.pow(0.0006,dt);
    else if (this.inWater) fric=Math.pow(0.02,dt);
    else if (this.onGround) fric=Math.pow(0.0009,dt);
    else fric=Math.pow(0.30,dt);
    this.vx*=fric; this.vz*=fric;
    const hs=Math.hypot(this.vx,this.vz);
    if (hs>speed){ this.vx=this.vx/hs*speed; this.vz=this.vz/hs*speed; }

    if (this.flying){
      let vy=0;
      if (input.jump) vy+=1; if (input.sneak) vy-=1;
      this.vy = vy*speed;
    } else if (this.inWater){
      this.vy -= 9.0*dt;
      if (input.jump) this.vy = Math.min(this.vy+22*dt, 3.2);
      if (input.sneak) this.vy -= 8*dt;
      this.vy = Math.max(this.vy, -3.6);
    } else if (this.inLava){
      this.vy -= 12*dt;
      if (input.jump) this.vy = Math.min(this.vy+16*dt, 2.0);
      this.vy = Math.max(this.vy, -2.4);
    } else {
      this.vy -= 30.0*dt;
      if (this.vy<-78) this.vy=-78;
      if (input.jump && this.onGround){ this.vy=8.95; this.onGround=false; if(this.sprint){this.vx+=wx*2.6; this.vz+=wz*2.6;} }
    }
    // fall damage bookkeeping
    if (this.onGround||this.flying||this.inWater) this.fallStart=null;
    else if (this.fallStart===null && this.vy<0) this.fallStart=this.y;

    const wasGround=this.onGround;
    this.onGround=false;
    const before=this.y;
    // sneak: don't walk off edges
    let sx2=this.x, sz2=this.z;
    const r=this.move(this.world,this.vx*dt,this.vy*dt,this.vz*dt);
    if (r.hy && this.vy<=0) this.onGround=true;
    if (this.sneak && wasGround && this.onGround){
      if (!this.groundUnder()){
        this.x=sx2; this.z=sz2;
        if (!this.groundUnder()){ /* nothing */ }
      }
    }
    if (this.onGround && !wasGround && this.fallStart!==null){
      const fall=this.fallStart-this.y;
      if (fall>3.2 && !this.inWater && this.mode!=='creative') this.damage(Math.floor(fall-3));
      if (fall>0.6) Sfx.step();
      this.fallStart=null;
    }
    // footsteps
    if (this.onGround && (Math.abs(this.vx)+Math.abs(this.vz))>0.6){
      this.stepDist += Math.hypot(this.vx,this.vz)*dt;
      if (this.stepDist>1.9){ this.stepDist=0;
        const b=this.world.getBlockSafe(Math.floor(this.x),Math.floor(this.y-0.2),Math.floor(this.z));
        if (b) Sfx.step(b); }
      this.bobT += dt*Math.hypot(this.vx,this.vz)*1.5;
    }
    // environment damage
    if (this.mode!=='creative'){
      if (this.inLava){ this.lavaT=(this.lavaT||0)+dt; if(this.lavaT>0.5){ this.lavaT=0; this.damage(4);} }
      else this.lavaT=0;
      if (this.headInWater){ this.air-=dt*20; if(this.air<0){ this.air=0;
          this.drownT=(this.drownT||0)+dt; if(this.drownT>1){this.drownT=0; this.damage(2);} } }
      else { this.air=Math.min(300,this.air+dt*80); this.drownT=0; }
      if (this.y<-6){ this.voidT=(this.voidT||0)+dt; if(this.voidT>0.5){this.voidT=0; this.damage(4);} }
      const inCactus = this.touchingBlock(37);
      if (inCactus){ this.cactusT=(this.cactusT||0)+dt; if(this.cactusT>0.5){this.cactusT=0; this.damage(1);} }
      // hunger + regen
      this.exhaust=(this.exhaust||0)+ (Math.hypot(this.vx,this.vz)*dt*(this.sprint?0.10:0.02));
      if (this.exhaust>4){ this.exhaust=0;
        if (this.sat>0) this.sat=Math.max(0,this.sat-1); else this.food=Math.max(0,this.food-1); }
      if (this.food>=18 && this.health<20){ this.regenT+=dt;
        if (this.regenT>3.5){ this.regenT=0; this.heal(1); this.exhaust+=1.5; } }
      else this.regenT=0;
      if (this.food<=0){ this.starveT+=dt; if(this.starveT>4){ this.starveT=0; this.damage(1);} }
    }
    // pick up items
    for (const e of this.world.entities){
      if (!(e instanceof ItemEntity) || e.dead || e.pickDelay>0) continue;
      if (Math.abs(e.x-this.x)<1.1 && Math.abs(e.z-this.z)<1.1 && Math.abs(e.y-this.y-0.6)<1.4){
        const left=this.inv.addStack(e.stack);
        if (!left){
          e.remove(); Sfx.pop(); refreshHotbar();
          if(MP.connected){
            const msg = {t:'pickupItem', eid: e.id};
            if(MP.isHost) broadcast(msg); else { const host = MP.peers.get('host'); if(host) host.conn.send(msg); }
          }
        }
        else e.stack=left;
      }
    }
  }
  groundUnder(){
    const r=this.w/2-0.02;
    for(const [ox,oz] of [[-r,-r],[r,-r],[-r,r],[r,r]])
      if (isSolid(this.world.getBlockSafe(Math.floor(this.x+ox),Math.floor(this.y-0.12),Math.floor(this.z+oz)))) return true;
    return false;
  }
  touchingBlock(id){
    const b=this.aabb();
    for(let y=Math.floor(b[1]);y<=Math.floor(b[4]-0.01);y++)
    for(let z=Math.floor(b[2]);z<=Math.floor(b[5]-0.01);z++)
    for(let x=Math.floor(b[0]);x<=Math.floor(b[3]-0.01);x++)
      if (this.world.getBlockSafe(x,y,z)===id) return true;
    return false;
  }
  eyeY(){ return this.y + (this.sneak?1.50:1.62); }
}

/* ------------------------------------------------------------------ *
 * 18. MINING / PLACING                                                 *
 * ------------------------------------------------------------------ */
function canHarvest(def, item){
  if (def.tool!=='pickaxe') return true;
  if (!item) return false;
  const it=itemDef(item.id);
  return !!(it && it.tool==='pickaxe' && it.tier>=def.level);
}
function breakSeconds(def, item){
  if (def.hardness<0) return Infinity;
  if (def.hardness===0) return 0;
  let speed=1;
  const it=item?itemDef(item.id):null;
  if (it && it.tool && it.tool===def.tool) speed=TIER_SPEED[it.tier];
  const harvest=canHarvest(def,item);
  let dmg = speed/def.hardness;
  dmg /= harvest?30:100;
  return 1/Math.max(dmg,0.0001);
}
function damageTool(p, amount){
  const s=p.held(); if(!s) return;
  const d=itemDef(s.id);
  if (!d || !d.maxDur) return;
  if (p.mode==='creative') return;
  s.dur=(s.dur||0)+amount;
  if (s.dur>=d.maxDur){ p.inv.set(p.sel,null); Sfx.hit(); }
  refreshHotbar();
}
function dropStack(world,x,y,z,st,eid){
  if(st&&st.count>0) {
    const e = new ItemEntity(world,x,y,z,st);
    if(eid) e.id = eid; else e.id = Math.random().toString(36).substr(2,9);
    world.entities.push(e);
    if(MP.connected && !eid) {
       const msg = { t:'dropItem', x, y, z, id: st.id, count: st.count, eid: e.id };
       if(MP.isHost) broadcast(msg); else { const host = MP.peers.get('host'); if(host) host.conn.send(msg); }
    }
  }
}

function breakBlock(world,p,x,y,z,remote){
  const id=world.getBlock(x,y,z);
  if (id<=0) return;
  const def=BLOCKS[id];
  if (def.hardness<0) return;
  const item=p? p.held() : null;
  world.setBlock(x,y,z,0);
  if (id===31||id===33||id===34) world.tiles.delete(x+','+y+','+z);
  spawnBlockParticles(x,y,z,id,14);
  Sfx.dig(id);
  if(!remote && p && p.mode!=='creative'){
    if (canHarvest(def,item)){
      let drop=def.drop, count=def.dropCount||1;
      if (drop===-1){
        drop = Math.random()<0.05 ? 106 : (Math.random()<0.06? (id===20?20:18) : 0);
        count=1;
      }
      if (drop>0) dropStack(world,x+0.5,y+0.5,z+0.5,stackOf(drop,count));
    }
    damageTool(p,1);
    p.exhaust=(p.exhaust||0)+0.025;
    p.score+=1;
    // sync multiplayer
    mpSendBlockBreak(x,y,z);
  }
  // gravity blocks
  fallCheck(world,x,y+1,z);
  updateLitFurnaceNeighbors(world,x,y,z);
}
function fallCheck(world,x,y,z){
  let id=world.getBlock(x,y,z);
  let guard=0;
  while((id===9||id===11) && guard++<CH){
    let ny=y;
    while(ny>0 && world.getBlockSafe(x,ny-1,z)===0) ny--;
    if (ny===y) break;
    world.setBlock(x,y,z,0); world.setBlock(x,ny,z,id);
    y=y+1; id=world.getBlock(x,y,z);
  }
}
function updateLitFurnaceNeighbors(){ /* placeholder for future block updates */ }

function placeBlock(world,p,hit,remote){
  const st=p? p.held() : null; if(!st) return false;
  const d=itemDef(st.id);
  if (!d) return false;
  // buckets
  if (st.id===122){
    const f=world.getBlock(hit.x,hit.y,hit.z);
    if (f===7||f===8){ world.setBlock(hit.x,hit.y,hit.z,0);
      if(!remote && p) p.inv.set(p.sel, stackOf(f===7?123:124,1)); Sfx.place(f); refreshHotbar();
      if(!remote) mpSendBlockPlace(hit.x,hit.y,hit.z,0);
      return true; }
    return false;
  }
  if (st.id===123||st.id===124){
    const bx=hit.x+hit.face[0], by=hit.y+hit.face[1], bz=hit.z+hit.face[2];
    if (world.getBlockSafe(bx,by,bz)===0 || BLOCKS[world.getBlockSafe(bx,by,bz)].replaceable){
      world.setBlock(bx,by,bz, st.id===123?7:8);
      if(!remote && p && p.mode!=='creative') p.inv.set(p.sel, stackOf(122,1));
      Sfx.place(7); refreshHotbar();
      if(!remote) mpSendBlockPlace(bx,by,bz,st.id===123?7:8);
      return true;
    }
    return false;
  }
  if (d.food && p && p.mode==='survival'){ return false; }
  if (d.block==null) return false;
  const bx=hit.x+hit.face[0], by=hit.y+hit.face[1], bz=hit.z+hit.face[2];
  if (by<0||by>=CH) return false;
  const cur=world.getBlockSafe(bx,by,bz);
  if (cur!==0 && !BLOCKS[cur].replaceable) return false;
  if(p){
    const bb=p.aabb();
    if (BLOCKS[d.block].solid &&
        bb[0]<bx+1 && bb[3]>bx && bb[1]<by+1 && bb[4]>by && bb[2]<bz+1 && bb[5]>bz) return false;
  }
  for (const e of world.entities){
    if (!(e instanceof MobEntity)||e.dead) continue;
    const eb=e.aabb();
    if (BLOCKS[d.block].solid && eb[0]<bx+1&&eb[3]>bx&&eb[1]<by+1&&eb[4]>by&&eb[2]<bz+1&&eb[5]>bz) return false;
  }
  if (d.block===30 && !isSolid(world.getBlockSafe(bx,by-1,bz))) return false;
  let id=d.block;
  if (id===33) id=33;
  world.setBlock(bx,by,bz,id);
  if (id===31) world.tiles.set(bx+','+by+','+bz,{type:'chest',inv:new Array(27).fill(0)});
  if (id===33) world.tiles.set(bx+','+by+','+bz,{type:'furnace',input:0,fuel:0,out:0,burn:0,burnMax:0,cook:0});
  Sfx.place(id);
  if(!remote && p && p.mode!=='creative'){ p.inv.removeOne(p.sel); }
  refreshHotbar();
  if(!remote) mpSendBlockPlace(bx,by,bz,id);
  return true;
}

/* ------------------------------------------------------------------ *
 * 19. MOB SPAWNING                                                     *
 * ------------------------------------------------------------------ */
const PASSIVE=['pig','cow','sheep','chicken','wolf','villager'];
const HOSTILE=['zombie','skeleton','creeper','spider','enderman','slime'];
function countMobs(world){
  let h=0,p=0;
  for(const e of world.entities){ if(e instanceof MobEntity && !e.dead){ if(e.hostile)h++; else p++; } }
  return {h,p};
}
function trySpawnMobs(world, dt){
  world._spawnT=(world._spawnT||0)+dt;
  if (world._spawnT<1.4) return;
  world._spawnT=0;
  const c=countMobs(world);
  const night = U.skyLightMul.value<0.42;
  const maxH = 22, maxP = 14;
  for(let attempt=0; attempt<8; attempt++){
    const a=Math.random()*6.283, r=26+Math.random()*20;
    const x=player.x+Math.cos(a)*r, z=player.z+Math.sin(a)*r;
    if (!world.getChunk(Math.floor(x/CS),Math.floor(z/CS))) continue;
    const y=findGround(world,x,z);
    if (y<1) continue;
    const ground=world.getBlockSafe(Math.floor(x),y-1,Math.floor(z));
    if (!ground||!isSolid(ground)) continue;
    const light=world.getLight(Math.floor(x),y,Math.floor(z));
    const sky=(light>>4), blk=(light&15);
    const bright=Math.max(sky*U.skyLightMul.value, blk);
    if (bright<7 && c.h<maxH){
      let kind=HOSTILE[(Math.random()*HOSTILE.length)|0];
      if (kind==='slime' && y>40) kind='zombie';
      if (kind==='enderman' && Math.random()<0.6) kind='zombie';
      const m=new MobEntity(world,kind,x,y,z, kind==='slime'?(1+((Math.random()*2)|0)):1);
      world.entities.push(m); c.h++;
      if (c.h>=maxH) break;
    } else if (bright>=9 && c.p<maxP && (ground===2||ground===40||ground===3)){
      if (Math.random()<0.55) continue;
      const kind=PASSIVE[(Math.random()*PASSIVE.length)|0];
      if (kind==='villager' && Math.random()<0.85) continue;
      if (kind==='wolf' && Math.random()<0.7) continue;
      const n=1+((Math.random()*3)|0);
      for(let i=0;i<n && c.p<maxP;i++){
        world.entities.push(new MobEntity(world,kind,x+(Math.random()-0.5)*3,y,z+(Math.random()-0.5)*3));
        c.p++;
      }
      break;
    }
  }
  // squids in water
  if (Math.random()<0.25){
    const a=Math.random()*6.283, r=20+Math.random()*16;
    const x=player.x+Math.cos(a)*r, z=player.z+Math.sin(a)*r;
    const xi=Math.floor(x), zi=Math.floor(z);
    if (world.getChunk(xi>>4,zi>>4)){
      for(let y=SEA;y>SEA-8;y--){
        if (world.getBlockSafe(xi,y,zi)===7 && world.getBlockSafe(xi,y+1,zi)===7){
          let cnt=0; for(const e of world.entities) if(e instanceof MobEntity && e.kind==='squid') cnt++;
          if (cnt<6) world.entities.push(new MobEntity(world,'squid',x,y,z));
          break;
        }
      }
    }
  }
}

/* ------------------------------------------------------------------ *
 * 20. ITEM ICONS                                                       *
 * ------------------------------------------------------------------ */
const ICON_CACHE={}, ICON_CANVAS={};
function tintedTile(t, tint){
  const c=document.createElement('canvas'); c.width=c.height=16;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false;
  drawTile(x,t,0,0,16,16);
  if (tint){
    x.globalCompositeOperation='multiply';
    x.fillStyle='rgb('+((tint[0]*255)|0)+','+((tint[1]*255)|0)+','+((tint[2]*255)|0)+')';
    x.fillRect(0,0,16,16);
    x.globalCompositeOperation='destination-in';
    drawTile(x,t,0,0,16,16);
    x.globalCompositeOperation='source-over';
  }
  return c;
}
function blockIcon(bid){
  const b=BLOCKS[bid];
  const cv=document.createElement('canvas'); cv.width=cv.height=32;
  const x=cv.getContext('2d'); x.imageSmoothingEnabled=false;
  let tint=null;
  if (b.tint==='grass'||b.tint==='foliage') tint=BIOMES[2].tint;
  if (b.tint==='spruce') tint=[0.36,0.58,0.36];
  const top=tintedTile(b.tx[2],tint), left=tintedTile(b.tx[1],b.tint==='foliage'?tint:(b.tint==='spruce'?tint:null)),
        right=tintedTile(b.tx[4],b.tint==='foliage'?tint:(b.tint==='spruce'?tint:null));
  x.save(); x.filter='brightness(1.0)';
  x.setTransform(1,0.5,-1,0.5,16,0); x.drawImage(top,0,0); x.restore();
  x.save(); x.filter='brightness(0.72)';
  x.setTransform(1,0.5,0,1,0,8); x.drawImage(left,0,0); x.restore();
  x.save(); x.filter='brightness(0.55)';
  x.setTransform(1,-0.5,0,1,16,16); x.drawImage(right,0,0); x.restore();
  x.setTransform(1,0,0,1,0,0);
  return cv;
}
function px16(x,arr,color){ x.fillStyle=color; for(const [a,b,w,h] of arr) x.fillRect(a*2,b*2,(w||1)*2,(h||1)*2); }
function stick(x){ x.strokeStyle='#9d7f4f'; x.lineWidth=5; x.lineCap='butt';
  x.beginPath(); x.moveTo(6,27); x.lineTo(21,11); x.stroke();
  x.strokeStyle='#7d6339'; x.lineWidth=1.5;
  x.beginPath(); x.moveTo(5,25); x.lineTo(19,9); x.stroke(); }
function itemIconCanvas(id){
  if (ICON_CANVAS[id]) return ICON_CANVAS[id];
  const d=itemDef(id);
  let result;
  if (d && d.block!=null) result=blockIcon(d.block);
  else {
    const cv=document.createElement('canvas'); cv.width=cv.height=32;
    const x=cv.getContext('2d'); x.imageSmoothingEnabled=false;
    const c=d?d.color:'#fff';
    const dark = shade(c,0.65), light = shade(c,1.25);
    switch(d?d.icon:'flat'){
      case 'stick': px16(x,[[10,2,2,2],[9,4,2,2],[8,6,2,2],[7,8,2,2],[6,10,2,2],[5,12,2,2]],c);
        px16(x,[[10,2,1,1],[8,6,1,1],[6,10,1,1]],light); break;
      case 'round': x.fillStyle=c; x.beginPath(); x.arc(16,17,9,0,6.3); x.fill();
        x.fillStyle=light; x.beginPath(); x.arc(13,13,3,0,6.3); x.fill(); break;
      case 'ingot': px16(x,[[4,7,8,2],[3,9,10,2],[4,11,8,2]],c); px16(x,[[5,7,4,1],[4,9,3,1]],light);
        px16(x,[[4,12,8,1]],dark); break;
      case 'gem': x.fillStyle=c; x.beginPath(); x.moveTo(16,4); x.lineTo(27,15); x.lineTo(16,28); x.lineTo(5,15); x.closePath(); x.fill();
        x.fillStyle=light; x.beginPath(); x.moveTo(16,4); x.lineTo(21,14); x.lineTo(16,16); x.lineTo(11,14); x.closePath(); x.fill(); break;
      case 'dust': for(let i=0;i<11;i++){ const a=(i*97)%13+3, b=(i*61)%13+4;
          px16(x,[[a,b,1.5,1.5]], i%3?c:light); } break;
      case 'meat': x.fillStyle=c; x.beginPath(); x.ellipse(16,18,10,7,0.3,0,6.3); x.fill();
        x.fillStyle=dark; x.beginPath(); x.ellipse(13,20,3,2,0.3,0,6.3); x.fill();
        px16(x,[[10,4,2,4]],'#e8e0d0'); break;
      case 'loaf': x.fillStyle=c; x.beginPath(); x.ellipse(16,17,11,7,0,0,6.3); x.fill();
        x.fillStyle=dark; for(let i=0;i<3;i++) x.fillRect(9+i*6,12,2,10); break;
      case 'bucket': px16(x,[[4,6,8,1],[4,7,1,7],[11,7,1,7],[5,13,6,1]],'#c0c0c0');
        px16(x,[[5,8,6,5]],c); px16(x,[[4,5,1,2],[11,5,1,2],[5,4,6,1]],'#a8a8a8'); break;
      case 'arrow': px16(x,[[11,2,2,2],[10,4,2,2],[9,6,2,2],[8,8,2,2],[7,10,2,2],[6,12,2,2]],'#9d7f4f');
        px16(x,[[12,1,2,2],[11,3,1,1]],'#d0d0d0'); px16(x,[[4,12,3,1],[4,13,1,2]],'#e8e8e8'); break;
      case 'bow': x.strokeStyle='#9d7f4f'; x.lineWidth=4; x.beginPath(); x.arc(10,16,11,-1.1,1.1); x.stroke();
        x.strokeStyle='#e0e0e0'; x.lineWidth=2; x.beginPath(); x.moveTo(15,6); x.lineTo(15,26); x.stroke(); break;
      case 'pickaxe': stick(x); x.fillStyle=c;
        x.beginPath(); x.moveTo(5,12); x.lineTo(12,4); x.lineTo(20,4); x.lineTo(27,12);
        x.lineTo(23,14); x.lineTo(18,8); x.lineTo(14,8); x.lineTo(9,14); x.closePath(); x.fill(); break;
      case 'axe': stick(x); x.fillStyle=c;
        x.beginPath(); x.moveTo(11,4); x.lineTo(24,4); x.lineTo(26,10); x.lineTo(20,15);
        x.lineTo(13,13); x.lineTo(9,8); x.closePath(); x.fill(); break;
      case 'shovel': stick(x); x.fillStyle=c;
        x.beginPath(); x.moveTo(16,3); x.lineTo(26,3); x.lineTo(26,12); x.lineTo(21,15);
        x.lineTo(15,10); x.closePath(); x.fill(); break;
      case 'sword':
        x.strokeStyle=c; x.lineWidth=5; x.lineCap='butt';
        x.beginPath(); x.moveTo(11,22); x.lineTo(25,7); x.stroke();
        x.fillStyle=c; x.beginPath(); x.moveTo(29,3); x.lineTo(29,10); x.lineTo(22,3); x.closePath(); x.fill();
        x.strokeStyle='#8a6a3a'; x.lineWidth=6;
        x.beginPath(); x.moveTo(7,25); x.lineTo(12,20); x.stroke();
        x.strokeStyle='#6b4f2a'; x.lineWidth=4;
        x.beginPath(); x.moveTo(3,29); x.lineTo(8,24); x.stroke(); break;
      default: px16(x,[[4,5,8,7]],c); px16(x,[[4,5,8,1]],light); px16(x,[[4,11,8,1]],dark);
    }
    result=cv;
  }
  ICON_CANVAS[id]=result; return result;
}
function itemIcon(id){
  if (!ICON_CACHE[id]) ICON_CACHE[id]=itemIconCanvas(id).toDataURL();
  return ICON_CACHE[id];

function shade(hex,f){
  const c=new THREE.Color(hex);
  const r=Math.min(255,(Math.pow(c.r,1/2.2)*255)*f)|0, g=Math.min(255,(Math.pow(c.g,1/2.2)*255)*f)|0, b=Math.min(255,(Math.pow(c.b,1/2.2)*255)*f)|0;
  return 'rgb('+r+','+g+','+b+')';
}

/* status icons */
function heartIcon(kind){
  const cv=document.createElement('canvas'); cv.width=cv.height=18;
  const x=cv.getContext('2d'); x.imageSmoothingEnabled=false;
  const draw=(col,half)=>{
    x.fillStyle=col;
    const p=[[1,2,3,2],[6,2,3,2],[0,4,10,3],[1,7,8,2],[2,9,6,2],[3,11,4,2],[4,13,2,2]];
    for(const [a,b,w,h] of p){ let ax=a,aw=w; if(half){ if(ax>=5) continue; if(ax+aw>5) aw=5-ax; }
      x.fillRect(ax*1.8,b*1.2,aw*1.8,h*1.2); }
  };
  draw('#3a0a0a',false);
  if (kind!=='empty') draw(kind==='half'?'#e03030':'#e03030', kind==='half');
  if (kind==='full'){ x.fillStyle='#ff8080'; x.fillRect(2*1.8,4*1.2,2*1.8,1.2); }
  return cv.toDataURL();
}
function foodIcon(kind){
  const cv=document.createElement('canvas'); cv.width=cv.height=18;
  const x=cv.getContext('2d'); x.imageSmoothingEnabled=false;
  const draw=(col,half)=>{
    x.fillStyle=col;
    const p=[[2,1,6,2],[1,3,8,4],[2,7,2,4],[6,7,2,4],[4,7,2,2]];
    for(const [a,b,w,h] of p){ let ax=a,aw=w; if(half){ if(ax>=5) continue; if(ax+aw>5) aw=5-ax; }
      x.fillRect(ax*1.8,b*1.4,aw*1.8,h*1.4); }
  };
  draw('#2a1a08',false);
  if (kind!=='empty') draw('#c07830', kind==='half');
  return cv.toDataURL();
}
function bubbleIcon(pop){

  return cv.toDataURL();
}

const Gui = { open:null, craft:new Inventory(9), cursor:null, tile:null, tilePos:null,
              root:null, dragEl:null, tipEl:null, creativeFilter:'' };
let chatOpen=false;

function guiInit(){

function updateDrag(){

function chestInv(tile){ if(!tile.invObj){ tile.invObj=new Inventory(27); tile.invObj.load(tile.inv); } return tile.invObj; }
function furnaceInv(tile){ if(!tile.invObj){ tile.invObj=new Inventory(3); tile.invObj.load(tile.slots); } return tile.invObj; }

function getSlot(ref){
  if (ref.kind==='player') return player.inv.get(ref.i);
  if (ref.kind==='craft')  return Gui.craft.get(ref.i);
  if (ref.kind==='chest')  return chestInv(Gui.tile).get(ref.i);
  if (ref.kind==='furnace')return furnaceInv(Gui.tile).get(ref.i);
  if (ref.kind==='result') return currentResult();
  return null;
}
function setSlot(ref,v){
  if (ref.kind==='player') player.inv.set(ref.i,v);
  else if (ref.kind==='craft') Gui.craft.set(ref.i,v);
  else if (ref.kind==='chest') chestInv(Gui.tile).set(ref.i,v);
  else if (ref.kind==='furnace') furnaceInv(Gui.tile).set(ref.i,v);
}
function craftSize(){ return Gui.open==='table'?3:2; }
function currentResult(){
  if (Gui.open!=='inventory' && Gui.open!=='table') return null;
  const n=craftSize();
  const g=[];
  for(let y=0;y<n;y++) for(let x=0;x<n;x++) g.push(Gui.craft.get(y*3+x));
  const m=matchRecipe(g,n,n);
  return m? stackOf(m.out,m.count) : null;
}
function consumeCraft(){
  const n=craftSize();
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const i=y*3+x, s=Gui.craft.get(i);
    if (s){ s.count--; if(s.count<=0) Gui.craft.set(i,null); }
  }
}
function takeResult(all){
  let res=currentResult();
  if (!res) return;
  if (all){
    let guard=0;
    while(res && guard++<64){
      const left=player.inv.addStack(stackOf(res.id,res.count));
      if (left) break;
      consumeCraft(); player.score+=res.count;
      res=currentResult();
    }
    Sfx.pop();
  } else if (Gui.cursor){
    if (Gui.cursor.id===res.id && Gui.cursor.count+res.count<=maxStack(res.id)){
      Gui.cursor.count+=res.count; consumeCraft(); Sfx.pop();
    }
  } else {
    Gui.cursor=stackOf(res.id,res.count); consumeCraft(); Sfx.pop();
  }
  onGuiChange();
}
function quickMove(ref){
  const st=getSlot(ref); if(!st) return;
  // move `st` into the given player-inventory ranges, in order
  const toPlayer=(ranges)=>{
    let left={id:st.id,count:st.count,dur:st.dur};
    const ms=maxStack(left.id);
    for(const [lo,hi] of ranges){
      if (ms>1) for(let i=lo;i<hi && left;i++){
        const cur=player.inv.get(i);
        if (cur && cur.id===left.id && cur.count<ms){
          const n=Math.min(ms-cur.count,left.count); cur.count+=n; left.count-=n;
          if (left.count<=0) left=null;
        }
      }
      for(let i=lo;i<hi && left;i++){
        if (!player.inv.get(i)){ player.inv.set(i,{id:left.id,count:left.count,dur:left.dur}); left=null; }
      }
    }
    if (!left) setSlot(ref,null); else st.count=left.count;
  };
  if (ref.kind==='player'){
    if (Gui.open==='chest'){
      const inv=chestInv(Gui.tile);
      const left=inv.addStack({id:st.id,count:st.count,dur:st.dur});
      if(!left) setSlot(ref,null); else st.count=left.count;
    } else if (Gui.open==='furnace'){
      const inv=furnaceInv(Gui.tile);
      const target = SMELT[st.id]?0:(FUEL[st.id]?1:-1);
      if (target>=0){
        const cur=inv.get(target);
        if (!cur){ inv.set(target,{id:st.id,count:st.count,dur:st.dur}); setSlot(ref,null); }
        else if (cur.id===st.id){ const ms=maxStack(st.id); const n=Math.min(ms-cur.count,st.count);
          cur.count+=n; st.count-=n; if(st.count<=0) setSlot(ref,null); }
      }
    } else {
      if (ref.i<9) toPlayer([[9,36]]); else toPlayer([[0,9]]);
    }
  } else {
    toPlayer([[9,36],[0,9]]);
  }
  onGuiChange();
}
function slotClick(ref, ev){
  const right = ev.button===2;
  if (Gui.open==='creative'){
    if (ref.kind==='creative'){
      Gui.cursor = stackOf(ref.id, right?1:maxStack(ref.id));
      onGuiChange(); return;
    }
    if (Gui.cursor && ref.kind==='player' && ev.shiftKey){ Gui.cursor=null; onGuiChange(); return; }
  }
  if (ref.kind==='result'){ takeResult(ev.shiftKey); return; }
  if (ev.shiftKey){ quickMove(ref); return; }
  const st=getSlot(ref);
  if (ref.kind==='furnace' && ref.i===2){
    if (st && !Gui.cursor){ Gui.cursor=st; setSlot(ref,null); }
    else if (st && Gui.cursor && Gui.cursor.id===st.id){ Gui.cursor.count+=st.count; setSlot(ref,null); }
    onGuiChange(); return;
  }
  if (Gui.cursor){
    if (!st){
      if (right){ setSlot(ref,stackOf(Gui.cursor.id,1,Gui.cursor.dur)); Gui.cursor.count--; if(Gui.cursor.count<=0) Gui.cursor=null; }
      else { setSlot(ref,Gui.cursor); Gui.cursor=null; }
    } else if (st.id===Gui.cursor.id && maxStack(st.id)>1 && st.count<maxStack(st.id)){
      if (right){ st.count++; Gui.cursor.count--; if(Gui.cursor.count<=0) Gui.cursor=null; }
      else { const n=Math.min(maxStack(st.id)-st.count,Gui.cursor.count); st.count+=n; Gui.cursor.count-=n;
             if(Gui.cursor.count<=0) Gui.cursor=null; }
    } else { const tmp=st; setSlot(ref,Gui.cursor); Gui.cursor=tmp; }
  } else if (st){
    if (right){ const half=Math.ceil(st.count/2); Gui.cursor=stackOf(st.id,half,st.dur);
      st.count-=half; if(st.count<=0) setSlot(ref,null); }
    else { Gui.cursor=st; setSlot(ref,null); }
  }
  onGuiChange();
}
function onGuiChange(){ updateDrag(); renderGui(); refreshHotbar(); }

function mkSlotEl(ref){
  const s=el('div','slot');

    const row=el('div'); row.style.cssText='display:flex;align-items:center;gap:14px;margin-bottom:10px;justify-content:center';

/* ------------------------------------------------------------------ *
 * 23. FURNACE TICK                                                     *
 * ------------------------------------------------------------------ */
function tickFurnaces(world, dt){
  const ticks=dt*20;
  for (const [key,tile] of world.tiles){
    if (tile.type!=='furnace') continue;
    const inv=furnaceInv(tile);
    const input=inv.get(0), fuel=inv.get(1), out=inv.get(2);
    const rec = input? SMELT[input.id] : null;
    const canSmelt = !!(rec && (!out || (out.id===rec.out && out.count+rec.c<=maxStack(rec.out))));
    if (tile.burn>0){ tile.burn-=ticks; if(tile.burn<0) tile.burn=0; }
    if (canSmelt && tile.burn<=0 && fuel && FUEL[fuel.id]){
      tile.burnMax=FUEL[fuel.id]; tile.burn=tile.burnMax;
      if (fuel.id===124){ inv.set(1, stackOf(122,1)); }
      else { fuel.count--; if(fuel.count<=0) inv.set(1,null); }
    }
    if (tile.burn>0 && canSmelt){
      tile.cook+=ticks;
      if (tile.cook>=200){
        tile.cook=0;
        if (out) out.count+=rec.c; else inv.set(2, stackOf(rec.out, rec.c));
        input.count--; if(input.count<=0) inv.set(0,null);
        Sfx.pop();
      }
    } else {
      tile.cook=Math.max(0,tile.cook-ticks*2);
    }
    // lit / unlit block variant
    const p=key.split(',').map(Number);
    const cur=world.getBlock(p[0],p[1],p[2]);
    const want = tile.burn>0?34:33;
    if ((cur===33||cur===34) && cur!==want) world.setBlock(p[0],p[1],p[2],want,false);
    if (Gui.open==='furnace' && Gui.tile===tile){
      const fi=Gui.root&&Gui.root.querySelector('.flame i');
      const pi=Gui.root&&Gui.root.querySelector('.prog i');
      if (fi) fi.style.height=(tile.burnMax? (tile.burn/tile.burnMax*100):0)+'%';
      if (pi) pi.style.width=(tile.cook/200*100)+'%';
    }
  }
}

function worldList(){ return Store.get(K_WORLDS, []); }
function saveWorldList(l){ Store.set(K_WORLDS, l); }
function newWorldId(){ return 'w'+Date.now().toString(36)+Math.floor(Math.random()*1000).toString(36); }

function serializeWorld(){
  const mods={};
  for (const [k,m] of world.modified){
    const a=[]; for(const [i,v] of m){ a.push(i,v); }
    if (a.length) mods[k]=a;
  }
  const tiles={};
  for (const [k,tl] of world.tiles){
    if (tl.type==='chest') tiles[k]={t:'c', inv: tl.invObj? tl.invObj.serialize() : (tl.inv||[])};
    else tiles[k]={t:'f', s: tl.invObj? tl.invObj.serialize() : (tl.slots||[]), b:Math.round(tl.burn||0), bm:Math.round(tl.burnMax||0), ck:Math.round(tl.cook||0)};
  }
  return {
    v:1, seed:world.seed, time:Math.round(world.time), day:world.day,
    p:{x:player.x,y:player.y,z:player.z,yaw:player.yaw,pitch:player.pitch,
       hp:player.health,fd:player.food,st:player.sat,air:player.air,
       mode:player.mode, spawn:player.spawn, score:player.score},
    inv:player.inv.serialize(), mods, tiles
  };
}
function saveWorld(meta, silent){
  if (!world||!player) return;
  if(!meta||!meta.id) return; // multiplayer client - no local save
  const data=serializeWorld();
  const ok=Store.set(K_WORLD(meta.id), data);
  const list=worldList();
  const idx=list.findIndex(w=>w.id===meta.id);
  meta.lastPlayed=Date.now(); meta.seed=world.seed; meta.mode=player.mode;
  if (idx>=0) list[idx]=meta; else list.push(meta);
  saveWorldList(list);
  Cookie.set(C_LAST, meta.id, 365);
  try{ Cookie.set('larpcraft_w_'+meta.id, JSON.stringify({n:meta.name,s:world.seed,m:player.mode,t:meta.lastPlayed}), 365); }catch(e){}
  if (!silent) chat(t('load.saved'));
  return ok;
}
function loadWorldData(id){ return Store.get(K_WORLD(id), null); }
function deleteWorld(id){
  Store.del(K_WORLD(id));
  saveWorldList(worldList().filter(w=>w.id!==id));
  Cookie.del('larpcraft_w_'+id);
}

function requestPointer(){

function isLocked(){ return document.pointerLockElement===document.getElementById('gl'); }

function setupInput(){
  const cv=document.getElementById('gl');
  cv.addEventListener('mousedown',(e)=>{
    if (!inGame||paused||Gui.open||chatOpen) return;

  });
  addEventListener('mouseup',(e)=>{ if(e.button===0){input.attack=0; player&&(player.breaking=null);} if(e.button===2) input.use=0; });
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  addEventListener('mousemove',(e)=>{
    if (!isLocked()||!player) return;
    const s=S.sensitivity*0.0032;

    player.pitch = clamp(player.pitch, -1.5533, 1.5533);
  });
  addEventListener('wheel',(e)=>{
    if (!inGame||Gui.open||paused) return;
    player.sel=(player.sel + (e.deltaY>0?1:-1) + 9)%9;

  },{passive:true});
  addEventListener('keydown',(e)=>{
    if (chatOpen){ if(e.code==='Escape'){ closeChat(false); } return; }
    const c=e.code;
    if (c==='Escape'){
      if (Gui.open){ closeGui(); }
      else if (inGame) togglePause();
      e.preventDefault(); return;
    }
    if (!inGame) return;
    if (c==='KeyE'){ if(Gui.open) closeGui(); else if(!paused && !player.dead) openGui(player.mode==='creative'?'creative':'inventory'); e.preventDefault(); return; }
    if (Gui.open||paused) return;
    switch(c){
      case 'KeyW': input.fwd=1;
        if (performance.now()-lastW<260) input.sprint=1;
        lastW=performance.now(); break;
      case 'KeyS': input.back=1; break;
      case 'KeyA': input.left=1; break;
      case 'KeyD': input.right=1; break;
      case 'Space': input.jump=1;
        if (player.mode==='creative' && performance.now()-lastSpace<280){ player.flying=!player.flying; player.vy=0; }
        lastSpace=performance.now(); e.preventDefault(); break;
      case 'ShiftLeft': case 'ShiftRight': input.sneak=1; break;
      case 'ControlLeft': input.sprint=1; break;
      case 'KeyQ': dropHeld(e.ctrlKey); break;
      case 'F3': S.showF3=!S.showF3; f3El.classList.toggle('hidden',!S.showF3); e.preventDefault(); break;
      case 'KeyT': openChat(''); e.preventDefault(); break;
      case 'Slash': openChat('/'); e.preventDefault(); break;
      case 'Enter': openChat(''); e.preventDefault(); break;
      case 'F5': break;
    }
    if (c.startsWith('Digit')){
      const n=parseInt(c.slice(5),10);
      if (n>=1&&n<=9){ player.sel=n-1; refreshHotbar(); showItemName(); }
    }
  });
  addEventListener('keyup',(e)=>{
    switch(e.code){
      case 'KeyW': input.fwd=0; input.sprint=0; break;
      case 'KeyS': input.back=0; break;
      case 'KeyA': input.left=0; break;
      case 'KeyD': input.right=0; break;
      case 'Space': input.jump=0; break;
      case 'ShiftLeft': case 'ShiftRight': input.sneak=0; break;
      case 'ControlLeft': input.sprint=0; break;
    }
  });
  document.addEventListener('pointerlockchange',()=>{
    if (!isLocked() && inGame && !paused && !Gui.open && !chatOpen && player && !player.dead) togglePause();
  });
  addEventListener('beforeunload',()=>{ if(inGame&&meta) saveWorld(meta,true); });
}
function dropHeld(all){

  const n = all? st.count : 1;

  const e=new ItemEntity(world, player.x+d.x*0.6, player.eyeY()-0.2, player.z+d.z*0.6, drop);
  const eid = Math.random().toString(36).substr(2, 9); e.id = eid;
  e.vx=d.x*7; e.vy=d.y*7+2.4; e.vz=d.z*7; e.pickDelay=1.4;
  world.entities.push(e); refreshHotbar();
  if(MP.connected) {
    const msg = { t:'dropItem', x: e.x, y: e.y, z: e.z, id: drop.id, count: drop.count, eid };
    if(MP.isHost) broadcast(msg); else { const host = MP.peers.get('host'); if(host) host.conn.send(msg); }

}
function pickBlock(){
  const hit=currentHit();
  if (!hit) return;
  const id=hit.id;
  if (!ITEMS[id]) return;
  for(let i=0;i<9;i++){ const s=player.inv.get(i); if(s&&s.id===id){ player.sel=i; refreshHotbar(); return; } }

}
function currentHit(){

function useAction(){
  if (player.useCd>0||player.dead) return;
  player.useCd=0.22; player.swing=1;
  const hit=currentHit();
  const st=player.held();
  // interact with blocks first
  if (hit && !input.sneak){
    const id=hit.id;
    const k=hit.x+','+hit.y+','+hit.z;
    if (id===32){ openGui('table'); return; }
    if (id===31){ let tl=world.tiles.get(k); if(!tl){ tl={type:'chest',inv:new Array(27).fill(0)}; world.tiles.set(k,tl); }
      openGui('chest',tl,[hit.x,hit.y,hit.z]); Sfx.pop(); return; }
    if (id===33||id===34){ let tl=world.tiles.get(k);
      if(!tl){ tl={type:'furnace',slots:new Array(3).fill(0),burn:0,burnMax:0,cook:0}; world.tiles.set(k,tl); }
      openGui('furnace',tl,[hit.x,hit.y,hit.z]); return; }
  }
  if (!st) return;
  const d=itemDef(st.id);
  // eat
  if (d && d.food>0 && player.food<20 && player.mode!=='creative'){
    player.food=Math.min(20,player.food+d.food);
    player.sat=Math.min(player.food, player.sat+d.food*0.6);
    if (st.id===128 && Math.random()<0.8) player.damage(0);
    player.inv.removeOne(player.sel); Sfx.eat(); refreshHotbar(); refreshBars(); return;
  }
  // bow
  if (st.id===160){
    if (player.mode!=='creative' && player.inv.count(117)<=0) return;
    const dir=new THREE.Vector3(); camera.getWorldDirection(dir);
    const sp=42;
    const a=new ArrowEntity(world, camera.position.x+dir.x*0.6, camera.position.y+dir.y*0.6, camera.position.z+dir.z*0.6,
      dir.x*sp, dir.y*sp, dir.z*sp, player, 6);
    world.entities.push(a); Sfx.bow();
    if (player.mode!=='creative'){
      for(let i=0;i<INV_SIZE;i++){ const s=player.inv.get(i); if(s&&s.id===117){ s.count--; if(s.count<=0) player.inv.set(i,null); break; } }
      damageTool(player,1);
    }
    return;
  }
  if (hit) placeBlock(world,player,hit);
}
function attackTick(dt){
  if (!input.attack||player.dead) return;
  // attack a mob if one is in front
  const d=new THREE.Vector3(); camera.getWorldDirection(d);
  if (player.attackCd<=0){
    let best=null, bestT=1e9;
    for (const e of world.entities){
      if (!(e instanceof MobEntity)||e.dead) continue;
      const cx=e.x-camera.position.x, cy=e.y+e.h*0.5-camera.position.y, cz=e.z-camera.position.z;
      const dist=Math.hypot(cx,cy,cz);
      if (dist>4.2) continue;
      const dot=(cx*d.x+cy*d.y+cz*d.z)/dist;
      if (dot<0.94) continue;
      if (dist<bestT){ bestT=dist; best=e; }
    }
    if (best){
      player.attackCd=0.42; player.swing=1;
      const st=player.held(); const it=st?itemDef(st.id):null;
      let dmg = it&&it.tool==='sword'? it.dmg : (it&&it.tool? it.dmg-1 : 1);
      if (player.sprint) dmg+=1;
      best.damage(Math.max(1,dmg), player);
      if (it&&it.maxDur) damageTool(player,1);
      player.exhaust=(player.exhaust||0)+0.1;
      return;
    }
    // PVP against remote players
    if(MP.enabled && MP.connected && player.mode==='survival'){
      mpAttackRemote();
    }
  }
  // otherwise mine
  const hit=currentHit();
  if (!hit){ player.breaking=null; setCrack(null,0); return; }
  const b=player.breaking;
  if (!b || b.x!==hit.x||b.y!==hit.y||b.z!==hit.z){
    player.breaking={x:hit.x,y:hit.y,z:hit.z}; player.breakT=0;
  }
  const def=BLOCKS[hit.id];
  const total=player.mode==='creative'?0.12:breakSeconds(def,player.held());
  player.breakT+=dt; player.swing=Math.max(player.swing,0.6);
  if (player.breakT%0.22 < dt) { Sfx.dig(hit.id); spawnBlockParticles(hit.x,hit.y,hit.z,hit.id,2); }
  const prog=clamp(player.breakT/Math.max(0.001,total),0,1);
  setCrack(hit, prog);
  if (prog>=1){
    breakBlock(world,player,hit.x,hit.y,hit.z);
    player.breaking=null; player.breakT=0; setCrack(null,0);
  }
}
function setCrack(hit,prog){
  if (!crackObj) return;
  if (!hit||prog<=0.02){ crackObj.visible=false; crackStage=-1; return; }
  crackObj.visible=true;
  crackObj.position.set(hit.x+0.5,hit.y+0.5,hit.z+0.5);
  const s=Math.min(5,Math.floor(prog*6));
  if (s!==crackStage){
    crackStage=s;
    const uvr=tileUV(TEX['crack'+s]);
    const a=crackObj.geometry.attributes.uv;
    const q=[[0,1],[1,1],[0,0],[1,0]];
    for(let f=0;f<6;f++) for(let k=0;k<4;k++){
      a.array[(f*4+k)*2]=uvr.u0+q[k][0]*(uvr.u1-uvr.u0);
      a.array[(f*4+k)*2+1]=uvr.v0+q[k][1]*(uvr.v1-uvr.v0);
    }
    a.needsUpdate=true;
  }
}

/* ---- chat ---- */
function openChat(prefix){
  chatOpen=true;
  document.exitPointerLock&&document.exitPointerLock();
  const inp=el('input'); inp.id='chatin'; inp.type='text'; inp.value=prefix||'';
  hudEl.appendChild(inp); inp.focus();
  inp.addEventListener('keydown',(e)=>{
    e.stopPropagation();
    if (e.code==='Enter'){ const v=inp.value; closeChat(true); if(v.trim()) runCommand(v); }
    else if (e.code==='Escape'){ closeChat(false); }
  });
}
function closeChat(){
  chatOpen=false;
  const inp=document.getElementById('chatin'); if(inp) inp.remove();
  if (inGame&&!paused&&!Gui.open) requestPointer();
}
function runCommand(v){
  if (v[0]!=='/'){
    if(MP.enabled&&MP.connected){
      mpSendChat(v);
    } else {
      chat('<You> '+v);
    }
    return;
  }
  const a=v.slice(1).split(/\s+/);
  const c=a[0].toLowerCase();
  if (c==='help'){ chat(t('chat.help')); }
  else if (c==='seed'){ chat(t('chat.seed', world.seed)); }
  else if (c==='gamemode'||c==='gm'){
    if(MP.enabled&&MP.connected&&!MP.isHost){ chat(t('mp.hostOnly')); return; }
    const m=(a[1]||'').toLowerCase();
    const nm = (m==='1'||m==='c'||m==='creative')?'creative':'survival';
    player.mode=nm; player.flying=false;
    chat(t('chat.gamemode', t(nm==='creative'?'gameMode.creative':'gameMode.survival')));
    if(MP.enabled&&MP.isHost) mpSendGameMode(nm);
    refreshBars();
  }
  else if (c==='time'){
    if(MP.enabled&&MP.connected&&!MP.isHost){ chat(t('mp.hostOnly')); return; }
    const s=(a[1]||'').toLowerCase();
    let v2 = s==='day'?1000 : (s==='night'?13000 : (s==='noon'?6000 : (s==='midnight'?18000 : parseInt(a[2]||a[1],10))));
    if (!isNaN(v2)){ world.time=((v2%24000)+24000)%24000; chat(t('chat.time', Math.round(world.time))); }
  }
  else if (c==='give'){
    if(MP.enabled&&MP.connected&&!MP.isHost){ chat(t('mp.hostOnly')); return; }
    const key=(a[1]||'').toLowerCase();
    let id=null;
    for(const k in ITEMS){ if(ITEMS[k].key===key){ id=+k; break; } }
    if (id===null && /^\d+$/.test(key)) id=parseInt(key,10);
    const n=parseInt(a[2]||'1',10)||1;
    if (id!==null && ITEMS[id]){ player.inv.addStack(stackOf(id,n)); refreshHotbar();
      chat(t('chat.give', itemName(id), n)); }
    else chat(t('chat.unknown'));
  }
  else if (c==='tp'){
    if(MP.enabled&&MP.connected&&!MP.isHost){ chat(t('mp.hostOnly')); return; }
    const x=parseFloat(a[1]), y=parseFloat(a[2]), z=parseFloat(a[3]);
    if (!isNaN(x)&&!isNaN(y)&&!isNaN(z)){ player.x=x; player.y=y; player.z=z; player.vy=0;
      chat(t('chat.tp', x.toFixed(0)+' '+y.toFixed(0)+' '+z.toFixed(0))); }
  }
  else if (c==='kill'){ player.damage(1000); }
  else if (c==='clear'){ for(let i=0;i<INV_SIZE;i++) player.inv.set(i,null); refreshHotbar(); chat(t('chat.cleared')); }
  else if (c==='save'){ saveWorld(meta); }
  else if (c==='nick'||c==='name'){

  }
  else chat(t('chat.unknown'));
}

function mkSlider(fmt, min, max, step, get, set, cls){
  const s=el('div','slider'+(cls?' '+cls:''));
  const knob=el('div','knob'); const lab=el('span');
  s.appendChild(knob); s.appendChild(lab);
  const upd=()=>{
    const v=get(); const f=(v-min)/(max-min);
    knob.style.left='calc('+(f*100)+'% - '+(f*16)+'px)';
    lab.textContent=fmt(v);
  };
  let drag=false;
  const apply=(e)=>{
    const r=s.getBoundingClientRect();
    let f=clamp((e.clientX-r.left)/r.width,0,1);
    let v=min+f*(max-min);
    v=Math.round(v/step)*step;
    v=clamp(Math.round(v*1000)/1000,min,max);
    set(v); upd();
  };
  s.addEventListener('mousedown',(e)=>{ drag=true; apply(e); e.preventDefault(); });
  addEventListener('mousemove',(e)=>{ if(drag) apply(e); });
  addEventListener('mouseup',()=>{ if(drag){ drag=false; saveSettings(); } });
  upd(); s._upd=upd;
  return s;
}
function mkToggle(labelKey, get, set, cls){
  const b=btn('', ()=>{ set(!get()); b.textContent=lbl(); saveSettings(); }, cls);
  const lbl=()=> t(labelKey)+': '+(get()?t('options.on'):t('options.off'));
  b.textContent=lbl();
  return b;
}
function mkField(labelText, value, hint){
  const f=el('div','field');
  const l=el('label',null,labelText); const i=el('input'); i.type='text'; i.value=value||'';
  f.appendChild(l); f.appendChild(i);
  if (hint){ f.appendChild(el('div','hint',hint)); }
  f._input=i;
  return f;
}
function worldPreview(seed){
  const N=32, cv=document.createElement('canvas'); cv.width=cv.height=N;
  const x=cv.getContext('2d');
  const w=new World(seed);
  const img=x.createImageData(N,N), d=img.data;
  const pal=[[38,72,150],[220,206,150],[86,150,60],[52,110,44],[220,200,120],[128,128,124],[236,242,250],[70,96,58]];
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){
    const ci=w.columnInfo((i-N/2)*14, (j-N/2)*14);
    const c=pal[ci.b];
    const sh=clamp(0.55+(ci.h-SEA)/60,0.4,1.35);
    const o=(j*N+i)*4;
    d[o]=clamp(c[0]*sh,0,255); d[o+1]=clamp(c[1]*sh,0,255); d[o+2]=clamp(c[2]*sh,0,255); d[o+3]=255;
  }
  x.putImageData(img,0,0);
  return cv.toDataURL();
}
const PREVIEW_CACHE={};
function previewFor(seed){ if(!PREVIEW_CACHE[seed]) PREVIEW_CACHE[seed]=worldPreview(seed); return PREVIEW_CACHE[seed]; }

function clearWorld(){

    for (const e of world.entities) if(e.obj){ entityGroup.remove(e.obj); disposeObj(e.obj); }
    ChunkMgr.clearAll(world);
    world.entities.length=0;

async function startWorld(m, data){
  loading=true; menuMode=false; inGame=false;
  const ls=screenLoading(t('load.generating'));
  showScreen(ls);
  await new Promise(r=>setTimeout(r,30));
  clearWorld();
  ChunkMgr.radiusOverride=null;
  meta=m;
  const seed = data? (data.seed>>>0) : (m.seed>>>0);
  world = new World(seed);
  if (data){
    world.time = data.time||0; world.day=data.day||1;
    for (const k in data.mods){
      const a=data.mods[k]; const mp=new Map();
      for (let i=0;i<a.length;i+=2) mp.set(a[i],a[i+1]);
      world.modified.set(k,mp);
    }
    for (const k in data.tiles){
      const tt=data.tiles[k];
      if (tt.t==='c') world.tiles.set(k,{type:'chest',inv:tt.inv});
      else world.tiles.set(k,{type:'furnace',slots:tt.s,burn:tt.b||0,burnMax:tt.bm||0,cook:tt.ck||0});
    }
  }
  // spawn point
  let sx=0, sz=0, sy=0;
  if (data && data.p){ sx=data.p.x; sy=data.p.y; sz=data.p.z; }
  else {
    let found=false;
    for (let r=0;r<900 && !found;r++){
      const ax=((r*37)%60)-30, az=((r*53)%60)-30;
      const ci=world.columnInfo(ax,az);
      if (ci.h>SEA+1 && ci.b!==0 && ci.b!==4){ sx=ax+0.5; sz=az+0.5; sy=ci.h+1; found=true; }
    }
    if (!found){ sx=0.5; sz=0.5; sy=world.columnInfo(0,0).h+1; }
  }
  player = new Player(world, sx, sy, sz);
  player.mode = data&&data.p? (data.p.mode||m.mode) : m.mode;
  if (data && data.p){
    player.yaw=data.p.yaw||0; player.pitch=data.p.pitch||0;
    player.health=data.p.hp!=null?data.p.hp:20; player.food=data.p.fd!=null?data.p.fd:20;
    player.sat=data.p.st||5; player.air=data.p.air||300;
    player.spawn=data.p.spawn||[sx,sy,sz]; player.score=data.p.score||0;
    player.inv.load(data.inv);
  } else {
    player.spawn=[sx,sy,sz];
    if (player.mode==='creative'){
      player.inv.set(0,stackOf(144,1)); player.inv.set(1,stackOf(159,1));
      player.inv.set(2,stackOf(30,64)); player.inv.set(3,stackOf(5,64));
    }
  }
  // generate the area around the spawn before the world appears
  const R=Math.min(S.renderDistance, 6);
  const total=(R*2+1)*(R*2+1);
  const ccx=Math.floor(sx/CS), ccz=Math.floor(sz/CS);
  let n=0;
  for (let dz=-R;dz<=R;dz++){
    for (let dx=-R;dx<=R;dx++){
      const cx=ccx+dx, cz=ccz+dz;
      if (!world.getChunk(cx,cz)) world.generate(cx,cz);
      n++;
    }
    ls._set(n/total*0.55, t('load.generating'));
    await new Promise(r=>setTimeout(r,0));
  }
  n=0;
  for (let dz=-R;dz<=R;dz++){
    for (let dx=-R;dx<=R;dx++){
      const ch=world.getChunk(ccx+dx,ccz+dz);
      if (ch&&ch.needLight) world.computeLight(ch);
      n++;
    }
    ls._set(0.55+n/total*0.20, t('load.building'));
    await new Promise(r=>setTimeout(r,0));
  }
  n=0;
  for (let dz=-R+1;dz<=R-1;dz++){
    for (let dx=-R+1;dx<=R-1;dx++){
      const ch=world.getChunk(ccx+dx,ccz+dz);
      if (ch&&ch.needMesh) ChunkMgr.mesh(world,ch);
      n++;
    }
    ls._set(0.75+n/total*0.25, t('load.building'));
    await new Promise(r=>setTimeout(r,0));
  }
  // drop the player onto the ground
  if (!data){
    let gy=CH-2;
    while(gy>1 && !isSolid(world.getBlockSafe(Math.floor(sx),gy,Math.floor(sz)))) gy--;
    player.y=gy+1; player.spawn=[sx,player.y,sz];
  }
  inGame=true; loading=false; paused=false;
  hudEl.classList.remove('hidden');
  f3El.classList.toggle('hidden',!S.showF3);
  showScreen(null);
  refreshHotbar(); refreshBars(); showItemName();
  chat('LARPCRAFT '+VERSION+' — '+t('chat.seed', world.seed));
  chat(t('chat.help'));
  lastSave=performance.now();
  Sfx.init(); Sfx.resume();
  requestPointer();
}

  if (Gui.open) { Gui.open=null; if(Gui.root){Gui.root.remove(); Gui.root=null;} Gui.cursor=null; updateDrag(); }

let viewGroup=null, viewMesh=null, viewKey=null;
const VIEW_TEX={};
function buildViewModel(){
  viewGroup=new THREE.Group();
  viewGroup.position.set(0.42,-0.36,-0.62);
  camera.add(viewGroup);
  scene.add(camera);
}
function updateViewModel(){
  const st=player?player.held():null;
  const key = st? st.id : 0;
  if (key!==viewKey){
    viewKey=key;
    if (viewMesh){ viewGroup.remove(viewMesh); viewMesh.geometry.dispose(); viewMesh=null; }
    if (key){
      const d=itemDef(key);
      if (d && d.block!=null){
        const b=BLOCKS[d.block];
        const g=new THREE.BoxGeometry(0.34,0.34,0.34);
        const at=g.attributes.uv.array;
        const q=[[0,1],[1,1],[0,0],[1,0]];
        for(let f=0;f<6;f++){ const r=tileUV(b.tx[f]);
          for(let k=0;k<4;k++){ at[(f*4+k)*2]=r.u0+q[k][0]*(r.u1-r.u0); at[(f*4+k)*2+1]=r.v0+q[k][1]*(r.v1-r.v0); } }
        g.attributes.uv.needsUpdate=true;
        const mat=new THREE.MeshStandardMaterial({map:atlasTex, roughness:0.9});
        viewMesh=new THREE.Mesh(g,mat); viewMesh.rotation.set(0.25,-0.6,0.1);
      } else {
        if (!VIEW_TEX[key]){
          const cv=itemIconCanvas(key);
          const tx=new THREE.CanvasTexture(cv);
          tx.magFilter=THREE.NearestFilter; tx.minFilter=THREE.LinearMipmapLinearFilter;
          tx.colorSpace=THREE.SRGBColorSpace;
          VIEW_TEX[key]=tx;
        }
        const g=new THREE.PlaneGeometry(0.36,0.36);
        const mat=new THREE.MeshStandardMaterial({map:VIEW_TEX[key], transparent:true, alphaTest:0.4,
          roughness:0.9, side:THREE.DoubleSide});
        viewMesh=new THREE.Mesh(g,mat); viewMesh.rotation.set(0,-0.45,-0.6);
      }
      viewMesh.castShadow=false; viewMesh.receiveShadow=false;
      viewGroup.add(viewMesh);
    }
  }
  if (!viewGroup) return;
  const sw=player?player.swing:0;
  const bob=player?Math.sin(player.bobT*6.0)*0.012:0;
  const bob2=player?Math.abs(Math.cos(player.bobT*6.0))*0.010:0;
  viewGroup.position.set(0.42+bob, -0.36-bob2 - (player&&player.sneak?0.06:0), -0.62);
  if (viewMesh){
    viewMesh.rotation.x = (viewMesh.userData.rx||0);
    viewGroup.rotation.x = -Math.sin(clamp(sw,0,1)*Math.PI)*0.9;
    viewGroup.rotation.z = Math.sin(clamp(sw,0,1)*Math.PI*2)*0.25;
  }
  if (viewMesh && viewMesh.material){
    const l=world?world.getLight(Math.floor(player.x),Math.floor(player.eyeY()),Math.floor(player.z)):0xF0;
    const v=clamp(Math.max((l>>4)/15*U.skyLightMul.value,(l&15)/15*0.9)*1.1+0.12,0.12,1.3);
    viewMesh.material.color.setRGB(v,v,v);
  }
}
