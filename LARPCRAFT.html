const Music = {
  next:14, scale:[0,3,5,7,10,12,15],
  update(dt){
    if (!Sfx.ctx || S.music<=0.001) return;
    this.next-=dt;
    if (this.next>0) return;
    this.next = 16+Math.random()*22;
    const c=Sfx.ctx, base=110*Math.pow(2,((Math.random()*3)|0)/12);
    for (let i=0;i<3;i++){
      const n=this.scale[(Math.random()*this.scale.length)|0];
      const o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
      o.type='sine'; o.frequency.value=base*Math.pow(2,(n+12*(i?1:0))/12);
      f.type='lowpass'; f.frequency.value=900;
      g.gain.setValueAtTime(0.0001,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.10,c.currentTime+3.0);
      g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+11);
      o.connect(f); f.connect(g); g.connect(Sfx.musicGain);
      o.start(); o.stop(c.currentTime+12);
    }
  }
};

/* ------------------------------------------------------------------ *
 * 30b. MULTIPLAYER — WebRTC PeerJS                                    *
 * ------------------------------------------------------------------ */
const MP = {
  enabled:false, isHost:false, connected:false,
  peer:null, myId:null, code:null,
  peers:new Map(), // pid -> {conn, nick, pos, yaw, hp, mode}
  nick:'Player',
  hostNick:'Host',
  _posTimer:0,
  _syncTimer:0
};

function genRoomCode(){
  const letters='ABCDEFGHJKLMNPQRSTUVWXYZ';
  const r=()=>letters[Math.floor(Math.random()*letters.length)];
  const d=()=>Math.floor(Math.random()*10);
  return r()+r()+d()+r()+d()+r();
}

function mpLoadNick(){
  const saved=Store.get('larpcraft.mpnick','');
  if(saved && /^[a-zA-Z0-9]{3,16}$/.test(saved)) MP.nick=saved;
  else MP.nick='Player'+Math.floor(Math.random()*999);
}
function mpSaveNick(nick){
  MP.nick=nick;
  Store.set('larpcraft.mpnick', nick);
}

function mpInit() {
  if (MP.peer) return;
  MP.myId = 'lpc-' + Math.random().toString(36).substr(2, 9);
  MP.peer = new Peer(MP.myId);
  MP.peer.on('open', id => console.log('[MP] My ID:', id));
  MP.peer.on('connection', conn => { if (!MP.isHost) conn.close(); else setupHostConnection(conn); });
  MP.peer.on('error', e => chat('[MP] Error: ' + e.type));
}

function mpStartHost(){
  MP.code=genRoomCode();
  // Destroy old peer if exists
  if(MP.peer){ try{MP.peer.destroy();}catch(e){} MP.peer=null; }
  // Create peer with room code as ID so clients can connect
  MP.peer=new Peer('lpc-'+MP.code);
  MP.peer.on('open', myId=>{
    MP.myId=myId;
    MP.isHost=true; MP.enabled=true; MP.connected=true;
    MP.peers.clear();
    chat('[MP] '+t('mp.youAreHost')+' — '+t('mp.code')+': '+MP.code);
    refreshPauseMultiplayerUI();
  });
  MP.peer.on('connection', conn=>{
    if (!MP.isHost){ conn.close(); return; }
    handleHostIncoming(conn);
  });
  MP.peer.on('error', e=>{
    chat('[MP] Error: '+e.type);
  });
}

function mpStop(){
  if (MP.peer){
    for(const [id,p] of MP.peers){ try{p.conn.close();}catch(e){} }
    MP.peers.clear();
    try{MP.peer.destroy();}catch(e){}
    MP.peer=null;
  }
  MP.enabled=false; MP.isHost=false; MP.connected=false;
  MP.code=null; MP.myId=null;
  removeRemotePlayers();
  chat('[MP] '+t('mp.disconnected'));
}

function setupHostConnection(conn) {
  const pid = conn.peer;
  conn.on('open', () => {
    const nick = (conn.metadata && conn.metadata.nick) || 'Player';
    MP.peers.set(pid, { conn, nick, pos: { x: 0, y: 0, z: 0 }, yaw: 0, hp: 20, mode: 'survival' });
    chat('[MP] ' + nick + ' joined');
    conn.send({ t: 'welcome', seed: world.seed, time: world.time, day: world.day, hostNick: MP.nick, mode: player.mode, spawn: { x: player.x, y: player.y, z: player.z } });
    const mods = {};
    for (const [k, m] of world.modified) { const a = []; for (const [i, v] of m) a.push(i, v); if (a.length) mods[k] = a; }
    conn.send({ t: 'worldMods', mods });
  });
  conn.on('data', data => handleHostMessage(pid, data));
  conn.on('close', () => { const p = MP.peers.get(pid); if (p) chat('[MP] ' + p.nick + ' left'); MP.peers.delete(pid); removeRemotePlayer(pid); });
}

function setupClientConnection(conn) {
  conn.on('open', () => { MP.connected = true; MP.peers.set('host', { conn, nick: 'Host' }); });
  conn.on('data', data => handleClientMessage(data));
  conn.on('close', () => { MP.connected = false; chat('[MP] Disconnected'); exitToMenu(); });
}

function handleHostMessage(pid, data) {
  const p = MP.peers.get(pid); if (!p) return;
  switch (data.t) {
    case 'pos': p.pos = data.pos; p.yaw = data.yaw; updateRemotePlayer(pid, data); broadcast({ t: 'playerPos', pid, pos: data.pos, yaw: data.yaw, nick: p.nick }, pid); break;
    case 'chat': const msg = '<' + p.nick + '> ' + data.msg; chat(msg); broadcast({ t: 'chat', msg, nick: p.nick }, pid); break;
    case 'blockBreak': breakBlock(world, null, data.x, data.y, data.z, true); broadcast(data, pid); break;
    case 'blockPlace': world.setBlock(data.x, data.y, data.z, data.id); broadcast(data, pid); break;
    case 'dropItem': broadcast({t:'spawnItem', ...data}, pid); break;
    case 'pickupItem': broadcast({t:'removeItem', eid:data.eid}, pid); break;
    case 'pvpHit': 
      if (data.to === 'host') { player.damage(data.dmg); chat('[PVP] Hit by ' + p.nick); }
      else { const target = MP.peers.get(data.to); if (target) target.conn.send({t:'pvpHit', dmg: data.dmg, from: p.nick}); }
      break;
  }
}

function handleClientMessage(data) {
  switch (data.t) {
    case 'welcome': MP.hostNick = data.hostNick; initClientWorld(data); break;
    case 'worldMods': applyOnlyMods(data.mods); break;
    case 'playerPos': updateRemotePlayer(data.pid, data); break;
    case 'chat': chat('<' + data.nick + '> ' + data.msg); break;
    case 'blockBreak': breakBlock(world, null, data.x, data.y, data.z, true); break;
    case 'blockPlace': world.setBlock(data.x, data.y, data.z, data.id); break;
    case 'spawnItem': spawnRemoteItem(data); break;
    case 'removeItem': removeRemoteEntity(data.eid); break;
    case 'pvpHit': player.damage(data.dmg); chat('[PVP] Hit by ' + data.from); break;
    case 'gamemode': player.mode = data.mode; refreshBars(); break;
  }
}

function initClientWorld(data) {
  loading = true; menuMode = false; inGame = false;
  world = new World(data.seed);
  world.time = data.time; world.day = data.day;
  const sp = data.spawn;
  const R = 6;
  for (let dz = -R; dz <= R; dz++) for (let dx = -R; dx <= R; dx++) world.generate(Math.floor(sp.x / 16) + dx, Math.floor(sp.z / 16) + dz);
  for(const [,ch] of world.chunks){ world.computeLight(ch); ch.lit=true; ch.needMesh=true; }
  for(const [,ch] of world.chunks){
    const n0=world.getChunk(ch.cx-1,ch.cz), n1=world.getChunk(ch.cx+1,ch.cz), n2=world.getChunk(ch.cx,ch.cz-1), n3=world.getChunk(ch.cx,ch.cz+1);
    if(n0&&n1&&n2&&n3) ChunkMgr.mesh(world,ch);
  }
  let sy=sp.y; for(let y=Math.min(CH-1,Math.floor(sp.y)+10);y>=0;y--){ if(world.getBlockSafe(Math.floor(sp.x),y,Math.floor(sp.z))!==0){ sy=y+1; break; } }
  player = new Player(world, sp.x, sy, sp.z);
  player.mode = data.mode;
  if(player.mode==='creative'){ player.inv.set(0,stackOf(144,1)); player.inv.set(1,stackOf(159,1)); player.inv.set(2,stackOf(30,64)); player.inv.set(3,stackOf(5,64)); }
  if(!hudEl) buildHUD(); if(!ICONS.heartFull) buildIcons();
  hudEl.classList.remove('hidden');
  loading = false; inGame = true; showScreen(null); requestPointer();
  refreshBars(); refreshHotbar();
  chat('[MP] Connected to ' + MP.hostNick);
}

function applyWorldData(data){
  if(!data||!data.seed){ chat('[MP] ERROR: invalid world data'); return; }
  try{
  chat('[MP] Generating world from seed '+data.seed+'...');
  // Create world from seed
  world = new World(data.seed);
  world.time = data.time||6000;
  world.day = data.day||1;
  const sp=data.spawn||{x:0,y:64,z:0};

  // FIRST: generate chunks so physics work
  const R=Math.min(S.renderDistance, 6);
  for(let dz=-R;dz<=R;dz++) for(let dx=-R;dx<=R;dx++){
    const cx=Math.floor(sp.x/CS)+dx;
    const cz=Math.floor(sp.z/CS)+dz;
    if(!world.getChunk(cx,cz)) world.generate(cx,cz);
  }

  // Apply mods on top
  for(const k in data.mods){
    const a=data.mods[k];
    const [cx2,cz2]=k.split(',').map(Number);
    for(let i=0;i<a.length;i+=2){
      const idx=a[i], bid=a[i+1];
      const y=(idx/(CS*CS))|0, r=idx-y*CS*CS, z=(r/CS)|0, x=r-z*CS;
      world.setBlock(cx2*CS+x, y, cz2*CS+z, bid, false);
    }
  }

  // Compute lighting
  for(const [,ch] of world.chunks){
    world.computeLight(ch); ch.lit=true; ch.needMesh=true;
  }

  // Mesh all chunks (force)
  for(const [,ch] of world.chunks){
    const n0=world.getChunk(ch.cx-1,ch.cz), n1=world.getChunk(ch.cx+1,ch.cz),
          n2=world.getChunk(ch.cx,ch.cz-1), n3=world.getChunk(ch.cx,ch.cz+1);
    if(n0&&n1&&n2&&n3) ChunkMgr.mesh(world,ch);
  }

  // Find safe spawn Y
  let sy=sp.y;
  for(let y=Math.min(CH-1,Math.floor(sp.y)+10);y>=0;y--){
    if(world.getBlockSafe(Math.floor(sp.x),y,Math.floor(sp.z))!==0){ sy=y+1; break; }
  }

  // NOW create player (chunks already exist for physics)
  player = new Player(world, sp.x, sy, sp.z);
  player.mode=data.mode||'survival';
  player.spawn=[sp.x,sy,sp.z];
  if(player.mode==='creative'){
    player.inv.set(0,stackOf(144,1)); player.inv.set(1,stackOf(159,1));
    player.inv.set(2,stackOf(30,64)); player.inv.set(3,stackOf(5,64));
  }

  // Ensure HUD is built and visible (only build once)
  if(!hudEl) buildHUD();
  if(!ICONS.heartFull) buildIcons();
  hudEl.classList.remove('hidden');
  refreshBars(); refreshHotbar();

  // Enter game
  loading=false; menuMode=false; inGame=true; paused=false;
  showScreen(null);
  requestPointer();
  chat('[MP] World loaded! Spawn at '+Math.round(sp.x)+' '+Math.round(sy)+' '+Math.round(sp.z));
  }catch(e){ chat('[MP] ERROR: '+e.message); console.error('applyWorldData:',e); }
}

function broadcast(data, excludePid){
  if(!MP.isHost||!MP.connected) return;
  for(const [pid,p] of MP.peers){
    if(pid===excludePid) continue;
    try{ p.conn.send(data); }catch(e){}
  }
}

function mpTick(dt){
  if(!MP.enabled||!MP.connected||!player) return;
  MP._posTimer+=dt;
  if(MP._posTimer>=0.05){ // 20 Hz position sync
    MP._posTimer=0;
    const posData={t:'pos', pos:{x:player.x,y:player.y,z:player.z}, yaw:player.yaw, nick:MP.nick};
    if(MP.isHost){
      // Host broadcasts position to all clients with playerPos type
      for(const [pid,p] of MP.peers){
        try{
          p.conn.send({t:'playerPos', pid:'host', pos:posData.pos, yaw:posData.yaw, nick:MP.nick});
        }catch(e){ console.error('[MP] Failed to send pos to',pid,e); }
      }
      // Also sync time periodically
      MP._syncTimer=(MP._syncTimer||0)+1;
      if(MP._syncTimer>=100){ // every 5 seconds
        MP._syncTimer=0;
        broadcast({t:'time', time:Math.round(world.time)});
        broadcast({t:'day', day:world.day});
      }
    } else {
      // Client sends position to host
      for(const [pid,p] of MP.peers){
        try{ p.conn.send(posData); }catch(e){}
      }
    }
  }
  // cleanup dead remote players
  MP._cleanupTimer+=dt;
  if(MP._cleanupTimer>2){
    MP._cleanupTimer=0;
    for(const [pid,p] of MP.peers){
      if(p.lastTick && performance.now()-p.lastTick>10000){
        MP.peers.delete(pid);
        removeRemotePlayer(pid);
      }
    }
  }
}

function getNickList(){
  const n=[MP.nick];
  for(const [id,p] of MP.peers) n.push(p.nick);
  return n;
}

function isNickTaken(nick){
  for(const [id,p] of MP.peers) if(p.nick===nick) return true;
  return false;
}

function isHost(){ return MP.isHost; }

/* ---- Remote Player Rendering ---- */
const remotePlayers={};

function spawnRemotePlayer(pid, nick){
  if(remotePlayers[pid]) return;
  const group=new THREE.Group();
  const black=new THREE.MeshLambertMaterial({color:0x111111});
  const darkGray=new THREE.MeshLambertMaterial({color:0x222222});
  // Head (0.8x0.8x0.8)
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.8,0.8), black);
  head.position.y=1.6;
  group.add(head);
  // Eyes
  const eyeW=new THREE.MeshBasicMaterial({color:0xffffff});
  const eyeB=new THREE.MeshBasicMaterial({color:0x111111});
  const eyeGeo=new THREE.BoxGeometry(0.12,0.08,0.02);
  const eyeL=new THREE.Mesh(eyeGeo,eyeW); eyeL.position.set(-0.15,1.65,0.41); group.add(eyeL);
  const eyeR=new THREE.Mesh(eyeGeo,eyeW); eyeR.position.set(0.15,1.65,0.41); group.add(eyeR);
  const pupilGeo=new THREE.BoxGeometry(0.06,0.06,0.02);
  const pupilL=new THREE.Mesh(pupilGeo,eyeB); pupilL.position.set(-0.14,1.64,0.42); group.add(pupilL);
  const pupilR=new THREE.Mesh(pupilGeo,eyeB); pupilR.position.set(0.16,1.64,0.42); group.add(pupilR);
  // Body (0.8x1.2x0.4)
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.8,1.2,0.4), darkGray);
  body.position.y=0.6;
  group.add(body);
  // Arms (0.25x1.2x0.25 each)
  const armGeo=new THREE.BoxGeometry(0.25,1.2,0.25);
  const armL=new THREE.Mesh(armGeo, black);
  armL.position.set(-0.525,0.6,0); group.add(armL);
  const armR=new THREE.Mesh(armGeo, black);
  armR.position.set(0.525,0.6,0); group.add(armR);
  // Legs (0.25x1.2x0.25 each)
  const legGeo=new THREE.BoxGeometry(0.25,1.2,0.25);
  const legL=new THREE.Mesh(legGeo, black);
  legL.position.set(-0.1875,0,0); group.add(legL);
  const legR=new THREE.Mesh(legGeo, black);
  legR.position.set(0.1875,0,0); group.add(legR);
  // Name tag (HTML overlay)
  const nameDiv=document.createElement('div');
  nameDiv.className='mp-nametag';
  nameDiv.innerHTML='<span>'+nick+'</span>';
  document.body.appendChild(nameDiv);
  scene.add(group);
  remotePlayers[pid]={group, nameDiv, hp:20, targetPos:new THREE.Vector3(), targetYaw:0, nick, legL, legR, armL, armR};
}

function updateRemotePlayer(pid, data){
  if(!remotePlayers[pid]) spawnRemotePlayer(pid, data.nick||'?');
  const rp=remotePlayers[pid];
  rp.targetPos.set(data.pos.x, data.pos.y, data.pos.z);
  rp.targetYaw=data.yaw||0;
  rp.nick=data.nick||'?';
  const p=MP.peers.get(pid);
  if(p){ p.pos=data.pos; p.yaw=data.yaw; p.lastTick=performance.now(); }
}

function updateRemotePlayersVisual(dt){
  for(const [pid,rp] of Object.entries(remotePlayers)){
    // smooth interpolation
    const prev=rp.group.position.clone();
    rp.group.position.lerp(rp.targetPos, 0.3);
    // rotate
    rp.group.rotation.y=rp.targetYaw;
    // walk animation
    const moved=rp.group.position.distanceTo(prev);
    if(rp.legL && moved>0.001){
      const t=performance.now()*0.008;
      const swing=Math.sin(t*6)*0.5;
      rp.legL.rotation.x=swing;
      rp.legR.rotation.x=-swing;
      if(rp.armL) rp.armL.rotation.x=-swing;
      if(rp.armR) rp.armR.rotation.x=swing;
    }
    // project name tag to screen (above head)
    const pos=rp.group.position.clone();
    pos.y+=2.1;
    pos.project(camera);
    const x=(pos.x*0.5+0.5)*window.innerWidth;
    const y=(-(pos.y*0.5)+0.5)*window.innerHeight;
    rp.nameDiv.style.left=x+'px';
    rp.nameDiv.style.top=y+'px';
    rp.nameDiv.style.display=pos.z<1?'block':'none';
  }
}

function removeRemotePlayer(pid){
  const rp=remotePlayers[pid];
  if(!rp) return;
  scene.remove(rp.group);
  disposeObj(rp.group);
  if(rp.nameDiv.parentNode) rp.nameDiv.parentNode.removeChild(rp.nameDiv);
  delete remotePlayers[pid];
}

function removeRemotePlayers(){
  for(const pid in remotePlayers) removeRemotePlayer(pid);
}

function handlePVPAttack(pid, data){
  if(!player||player.dead) return;
  const dist=Math.hypot(player.x-data.x, player.y-data.y, player.z-data.z);
  if(dist>4.5) return;
  player.damage(data.damage||1);
  chat('[PVP] You were hit for '+data.damage+' damage');
}

function mpAttackRemote(){
  if(!MP.enabled||!MP.connected) return;
  if(player&&player.mode!=='survival') return;
  const d=new THREE.Vector3(); camera.getWorldDirection(d);
  for(const [pid,rp] of Object.entries(remotePlayers)){
    const cx=rp.group.position.x-camera.position.x;
    const cy=rp.group.position.y+0.9-camera.position.y;
    const cz=rp.group.position.z-camera.position.z;
    const dist=Math.hypot(cx,cy,cz);
    if(dist>4.2) continue;
    const dot=(cx*d.x+cy*d.y+cz*d.z)/dist;
    if(dot<0.94) continue;
    // hit!
    const st=player.held(); const it=st?itemDef(st.id):null;
    let dmg=it&&it.tool==='sword'?it.dmg:(it&&it.tool?it.dmg-1:1);
    if(player.sprint) dmg+=1;
    dmg=Math.max(1,dmg);
    const pid2=pid;
    MP.peers.forEach((p,id)=>{
      if(id===pid2) try{p.conn.send({t:'pvpHit',damage:dmg,from:MP.nick});}catch(e){}
    });
    rp.hp=Math.max(0,rp.hp-dmg);
    if(rp.hp<=0){
      chat('[PVP] '+rp.nick+' killed!');
      removeRemotePlayer(pid);
      MP.peers.delete(pid);
    }
    return;
  }
}

/* ---- MP Chat Integration ---- */
function mpSendChat(msg){
  if(!MP.enabled||!MP.connected) return;
  if(MP.isHost){
    // host broadcasts to all
    broadcast({t:'chat',msg,nick:MP.nick});
    chat('<'+MP.nick+'> '+msg);
  } else {
    // client sends to host
    for(const [pid,p] of MP.peers){
      try{p.conn.send({t:'chat',msg});}catch(e){}
    }
  }
}

function mpSendBlockBreak(x,y,z){
  if(!MP.enabled||!MP.connected) return;
  if(MP.isHost) broadcast({t:'blockBreak',x,y,z});
  else for(const [pid,p] of MP.peers) try{p.conn.send({t:'blockBreak',x,y,z});}catch(e){}
}

function mpSendBlockPlace(x,y,z,id){
  if(!MP.enabled||!MP.connected) return;
  if(MP.isHost) broadcast({t:'blockPlace',x,y,z,id});
  else for(const [pid,p] of MP.peers) try{p.conn.send({t:'blockPlace',x,y,z,id});}catch(e){}
}

function mpSendGameMode(mode){
  if(!MP.enabled||!MP.connected||!MP.isHost) return;
  broadcast({t:'gamemode',mode});
  for(const [id,p] of MP.peers) p.mode=mode;
}

function mpFindHostByCode(code){
  return new Promise((resolve)=>{
    // Use a simple approach: try connecting to a known PeerJS server ID pattern
    // In practice, the host needs to share their actual peer ID
    // We'll use a broadcast channel or the code as the peer ID suffix
    const testId='lpc-'+code;
    const tempConn=MP.peer.connect(testId, {metadata:{nick:MP.nick}});
    let resolved=false;
    const timer=setTimeout(()=>{
      if(!resolved){ resolved=true; tempConn.close(); resolve(null); }
    }, 4000);
    tempConn.on('open',()=>{
      if(resolved) return; resolved=true; clearTimeout(timer);
      resolve(tempConn);
    });
    tempConn.on('error',()=>{
      if(resolved) return; resolved=true; clearTimeout(timer);
      resolve(null);
    });
  });
}

async function mpJoinByCode(code){
  if(!MP.peer) mpInit();
  // Wait for peer to be ready
  if(!MP.myId){
    await new Promise(r=>{
      const check=setInterval(()=>{
        if(MP.myId){clearInterval(check);r();}
      },100);
    });
  }
  MP.isHost=false; MP.enabled=true; MP.code=code;
  chat('[MP] '+t('mp.waitingForWorld'));
  const conn=MP.peer.connect('lpc-'+code, {metadata:{nick:MP.nick}});
  conn.on('open',()=>{
    MP.connected=true;
    chat('[MP] '+t('mp.connected')+' — requesting world...');
    // Request world data from host
    try{ conn.send({t:'requestWorld'}); }catch(e){}
  });
  conn.on('data', data=>{
    handleClientMessage(data);
  });
  conn.on('close',()=>{
    MP.connected=false;
    chat('[MP] '+t('mp.disconnected'));
    removeRemotePlayers();
  });
  MP.peers.set('host', {conn, nick:'Host', pos:{x:0,y:64,z:0}, yaw:0, health:20, mode:'creative'});
  // timeout
  setTimeout(()=>{
    if(!MP.connected){
      chat('[MP] Connection failed. Is the host online?');
      MP.enabled=false; MP.isHost=false; MP.connected=false;
      MP.peers.clear();
      try{MP.peer.destroy();}catch(e){}
      MP.peer=null; MP.code=null;
    }
  }, 6000);
}

/* ------------------------------------------------------------------ *
 * 31. MAIN LOOP                                                        *
 * ------------------------------------------------------------------ */
let lastT=performance.now(), barTimer=0, saveTimer=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-lastT)/1000; lastT=now;
  if (dt>0.12) dt=0.12;
  if (dt<=0) dt=0.0001;
  fpsN++; fpsT+=dt;
  if (fpsT>=0.5){ fps=Math.round(fpsN/fpsT); fpsN=0; fpsT=0; }

  if (menuMode && world){
    world.time = (world.time + dt*6)%24000;
    const h=world.columnInfo(0,0).h;
    menuAngle += dt*0.045;
    const cy=Math.max(h,SEA)+16;
    camera.position.set(Math.cos(menuAngle)*34, cy+8, Math.sin(menuAngle)*34);
    camera.lookAt(0, cy-2, 0);
    camera.updateMatrixWorld();
    ChunkMgr.update(world, camera.position.x, camera.position.z, 7, false);
    updateSky(world, dt);
    updateSunShadow(0, cy, 0);
    updateGodrays();
    render();
    return;
  }
  if (inGame && world && player){
    if (!paused && !player.dead){
      world.time += dt*20;
      if (world.time>=24000){ world.time-=24000; world.day++; chat(t('msg.day',world.day)); }
      Sfx.resume();
      const guiBlocked = !!Gui.open || chatOpen;
      const inp = guiBlocked? {fwd:0,back:0,left:0,right:0,jump:0,sneak:0,sprint:0} : input;
      player.update(dt, inp);
      if (!guiBlocked) attackTick(dt);
      else { player.breaking=null; setCrack(null,0); }
      // entities
      for (let i=world.entities.length-1;i>=0;i--){
        const e=world.entities[i];
        if (e.dead){ world.entities.splice(i,1); continue; }
        e.update(dt);
      }
      trySpawnMobs(world, dt);
      tickFurnaces(world, dt);
      Particles.update(dt);
      Music.update(dt);
    }
    // camera
    camera.rotation.order='YXZ';
    camera.position.set(player.x, player.eyeY(), player.z);
    camera.rotation.set(player.pitch, player.yaw, 0);
    camera.updateMatrixWorld();
    updateViewModel();
    // selection box
    const hit=(!Gui.open && !paused && !player.dead)? currentHit() : null;
    if (hit){ selMesh.visible=true; selMesh.position.set(hit.x+0.5,hit.y+0.5,hit.z+0.5); }
    else selMesh.visible=false;
    // streaming
    ChunkMgr.update(world, player.x, player.z, paused?2:9, false);
    updateSky(world, dt);
    updateSunShadow(player.x, player.y, player.z);
    updateGodrays();
    // underwater
    const headBlock=world.getBlockSafe(Math.floor(player.x),Math.floor(player.eyeY()),Math.floor(player.z));
    const wo=document.getElementById('waterol');
    if (wo) wo.style.opacity = headBlock===7?'1':(headBlock===8?'1':'0');
    if (wo && headBlock===8) wo.style.background='rgba(190,70,10,.72)';
    else if (wo) wo.style.background='rgba(40,90,190,.30)';
    if (headBlock===7){ scene.fog.density = 0.16; scene.fog.color.setRGB(0.05,0.16,0.32); }
    else if (headBlock===8){ scene.fog.density = 1.2; scene.fog.color.setRGB(0.45,0.10,0.02); }
    // hud
    barTimer+=dt;
    if (barTimer>0.2){ barTimer=0; refreshBars(); }
    if (itemNameTimer>0){ itemNameTimer-=dt; if(itemNameTimer<=0) itemNameEl.style.opacity=0; }
    if (S.showF3) updateF3();
    saveTimer+=dt;
    if (saveTimer>45 && !paused){ saveTimer=0; saveWorld(meta,true); chat(t('msg.autosave')); }
    // multiplayer tick
    mpTick(dt);
    updateRemotePlayersVisual(dt);
    render();
    return;
  }
  render();
}
function render(){
  if (!renderer) return;
  if (composer) composer.render();
  else renderer.render(scene, camera);
}
function updateF3(){
  const cx=Math.floor(player.x/CS), cz=Math.floor(player.z/CS);
  const ch=world.getChunk(cx,cz);
  const bi=ch? ch.biome[(Math.floor(player.z)&15)*CS+(Math.floor(player.x)&15)] : 0;
  const l=world.getLight(Math.floor(player.x),Math.floor(player.y+1),Math.floor(player.z));
  const hh=Math.floor(world.time/1000);
  const mm=Math.floor((world.time%1000)/1000*60);
  let ents=0, mobs=0;
  for(const e of world.entities){ ents++; if(e instanceof MobEntity) mobs++; }
  f3El.textContent =
    'LARPCRAFT '+VERSION+'   '+t('hud.fps')+': '+fps+'\n'+
    t('hud.pos')+': '+player.x.toFixed(2)+' / '+player.y.toFixed(2)+' / '+player.z.toFixed(2)+'\n'+
    'Chunk: '+cx+' '+cz+'   '+t('hud.chunks')+': '+world.chunks.size+'\n'+
    t('hud.biome')+': '+t(BIOME_NAME[bi])+'\n'+
    t('hud.light')+': sky '+(l>>4)+' block '+(l&15)+'\n'+
    t('hud.time')+': '+((hh+6)%24).toString().padStart(2,'0')+':'+mm.toString().padStart(2,'0')+'  ('+t('msg.day',world.day)+')\n'+
    t('hud.entities')+': '+ents+' ('+mobs+')\n'+
    'Seed: '+world.seed+'   '+(renderer.info.render.triangles/1000|0)+'k tris  '+renderer.info.render.calls+' calls';
}

/* ------------------------------------------------------------------ *
 * 32. BOOT                                                            *
 * ------------------------------------------------------------------ */
async function boot(){
  loadSettings();
  mpLoadNick();
  try{
    initRenderer();
  }catch(e){
    document.getElementById('errbox').style.display='block';
    document.getElementById('errbox').textContent = t('msg.webglFail')+'\n\n'+(e&&e.stack||e);
    return;
  }
  if (!renderer.capabilities.isWebGL2){
    S.ssao=false; S.bloom=false; S.godrays=false;
  }
  buildIcons();
  Particles.init();
  buildHUD();
  guiInit();
  buildHelpers();
  buildViewModel();
  setupInput();
  await initPost();
  pickSplash();
  startMenuScene();
  showScreen(screenTitle());
  const last=Cookie.get(C_LAST);
  if (last) selectedWorld=last;
  addEventListener('click',()=>{ Sfx.init(); Sfx.resume(); },{once:true});
  lastT=performance.now();
  requestAnimationFrame(frame);
}
boot();
